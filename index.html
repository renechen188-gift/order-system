    <span style="font-size:13px;color:var(--accent);font-weight:600">從</span><input type="date" value="${ksFrom}" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit" onchange="ksFrom=this.value;loadKitchenSummary()">
    <span style="font-size:13px;color:var(--accent);font-weight:600">到</span><input type="date" value="${ksTo}" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit" onchange="ksTo=this.value;loadKitchenSummary()">
    <button style="padding:6px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;background:var(--surface);cursor:pointer;font-family:inherit" onclick="setKsRange('today')">今日</button>
    <button style="padding:6px 12px;border:1px solid var(--accent);border-radius:8px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;border:none" onclick="setKsRange('week')">本週</button>
  </div>`;
  el.innerHTML = '<div class="section-bar">央廚叫貨彙總</div>' + picker + '<div class="loading">載入中…</div>';
  const kitchenSupIds = new Set(allSuppliers.filter(s => s.type === 'central_kitchen').map(s => s.id));
  const [{ data: intOrders }, { data: extOrders }] = await Promise.all([
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', ksFrom).lte('order_date', ksTo).eq('order_type', 'internal').in('status', ['submitted', 'confirmed', 'received']),
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', ksFrom).lte('order_date', ksTo).eq('order_type', 'external').in('status', ['submitted', 'confirmed', 'received'])
  ]);
  const orders = [...(intOrders || [])];
  (extOrders || []).forEach(o => {
    const kitchenItems = (o.order_items || []).filter(oi => kitchenSupIds.has(oi.supplier_id));
    if (kitchenItems.length) orders.push({ ...o, order_items: kitchenItems });
  });

  if (!orders?.length) { el.innerHTML = '<div class="section-bar">央廚叫貨彙總</div>' + picker + `<div class="empty-state"><div class="icon">📋</div><div class="msg">${ksFrom === ksTo ? ksFrom : ksFrom + ' ~ ' + ksTo} 無央廚叫貨單</div></div>`; return; }

  const catItems = {};
  const myCats = currentUser.assigned_cats;
  orders.forEach(order => {
    (order.order_items || []).forEach(oi => {
      const item = oi.items;
      const rawCat = item?.category || '其他';
      if (myCats?.length && !myCats.includes(rawCat)) return;
      const cat = getMergedCat(rawCat);
      const key = item?.id || oi.item_id;
      if (!catItems[cat]) catItems[cat] = {};
      if (!catItems[cat][key]) catItems[cat][key] = { name: item?.name || '', unit: item?.unit || '', total: 0, stores: [] };
      catItems[cat][key].total += oi.ordered_qty;
      catItems[cat][key].stores.push({ store: order.stores?.name || '', qty: oi.ordered_qty });
    });
  });

  const sn = s => s.replace('麻媽家','').replace('涼三伯','');
  let totalItems = 0;

  let html = '<div class="section-bar">央廚叫貨彙總</div>' + picker;
  let catIdx = 0;
  for (const [cat, items] of Object.entries(catItems)) {
    const il = Object.values(items);
    totalItems += il.length;
    const copyId = 'copy-ks-' + catIdx++;
    const storeMap = {};
    il.forEach(it => it.stores.forEach(s => {
      if (!storeMap[s.store]) storeMap[s.store] = [];
      storeMap[s.store].push(`  ${it.name} ${s.qty}${it.unit}`);
    }));
    let catCopy = `🍳 央廚叫貨單【${cat}】\n📅 ${ksFrom === ksTo ? ksFrom : ksFrom + ' ~ ' + ksTo}\n`;
    const brandStores = { '🔴 麻媽家': [], '🔵 涼三伯': [] };
    for (const [store, lines] of Object.entries(storeMap)) {
      const brand = store.startsWith('涼三伯') ? '🔵 涼三伯' : '🔴 麻媽家';
      brandStores[brand].push({ store, lines });
    }
    for (const [brand, stores] of Object.entries(brandStores)) {
      if (!stores.length) continue;
      catCopy += `\n${brand}\n`;
      stores.forEach(({ store, lines }) => { catCopy += `\n📍 ${sn(store)}：\n${lines.join('\n')}\n`; });
    }

    html += `<div class="card" style="margin-bottom:12px"><div class="card-header"><div class="card-header-left"><div class="card-supplier">${cat}</div><div class="card-date">${il.length} 項品項</div></div></div>`;
    for (const it of il) {
      html += `<div class="card-row"><div class="cr-info"><div class="cr-name">${it.name}</div><div class="cr-sub">${it.stores.map(s => { const isCool = s.store.startsWith('涼三伯'); return `<span class="fulfill-store" style="border-color:${isCool ? '#3b82f6' : '#ef4444'}40;color:${isCool ? '#3b82f6' : '#ef4444'}">${sn(s.store)} ${s.qty}</span>`; }).join(' ')}</div></div><div style="font-size:16px;font-weight:700;color:var(--purple);min-width:55px;text-align:right">${it.total} ${it.unit}</div></div>`;
    }
    const catKeys = [...kitchenSupIds].map(id => `'${id}:${cat}'`).join(',');
    html += `<div class="copy-text" id="${copyId}">${catCopy}</div><button class="copy-btn" onclick="copyToClipboard('${copyId}',[${catKeys}])">📋 複製【${cat}】</button></div>`;
  }
  el.innerHTML = html;
}

// ══════════ TRANSFER COST REPORT ══════════
const TC_CAT_MAP = { '大陸調料': '大陸調料', '主食': '主食/醬包/包材', '醬包類': '主食/醬包/包材', '制服耗材': '主食/醬包/包材', '包材': '主食/醬包/包材' };
function tcCat(cat) { return TC_CAT_MAP[cat] || '其他'; }
const TC_CAT_ORDER = ['大陸調料', '主食/醬包/包材', '其他'];
let tcMonth = new Date().toISOString().slice(0, 7);
async function loadTransferCost() {
  const el = document.getElementById('transferCostPage');
  const picker = `<div style="padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px">
    <span style="font-size:13px;color:var(--accent);font-weight:600">月份</span>
    <input type="month" value="${tcMonth}" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit" onchange="tcMonth=this.value;loadTransferCost()">
  </div>`;
  el.innerHTML = '<div class="section-bar">央廚調撥報表</div>' + picker + '<div class="loading">載入中…</div>';

  const kitchenSupIds = new Set(allSuppliers.filter(s => s.type === 'central_kitchen').map(s => s.id));
  const monthStart = tcMonth + '-01';
  const monthEnd = tcMonth + '-31';
  const [{ data: intOrders }, { data: extOrders }, { data: itemSups }] = await Promise.all([
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', monthStart).lte('order_date', monthEnd).eq('order_type', 'internal').neq('status', 'cancelled'),
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', monthStart).lte('order_date', monthEnd).eq('order_type', 'external').neq('status', 'cancelled'),
    sb.from('item_suppliers').select('item_id,supplier_id,unit_price')
  ]);

  const priceMap = {};
  (itemSups || []).forEach(is => { priceMap[is.item_id + '_' + is.supplier_id] = is.unit_price; priceMap[is.item_id] = priceMap[is.item_id] || is.unit_price; });

  const storeOnly = o => o.stores?.type === 'store';
  const orders = [...(intOrders || []).filter(storeOnly)];
  (extOrders || []).filter(storeOnly).forEach(o => {
    const kitchenItems = (o.order_items || []).filter(oi => kitchenSupIds.has(oi.supplier_id));
    if (kitchenItems.length) orders.push({ ...o, order_items: kitchenItems });
  });

  if (!orders?.length) { el.innerHTML = '<div class="section-bar">央廚調撥報表</div>' + picker + '<div class="empty-state"><div class="icon">📋</div><div class="msg">' + tcMonth + ' 無央廚調撥紀錄</div></div>'; return; }

  const storeData = {};
  orders.forEach(order => {
    const storeName = order.stores?.name || '?';
    const storeId = order.store_id;
    if (!storeData[storeName]) storeData[storeName] = { storeId, items: {}, total: 0 };
    (order.order_items || []).filter(oi => oi.status !== 'cancelled').forEach(oi => {
      const item = oi.items;
      const key = item?.id || oi.item_id;
      const price = priceMap[key + '_' + oi.supplier_id] || priceMap[key] || item?.purchase_price || 0;
      if (!storeData[storeName].items[key]) storeData[storeName].items[key] = { name: item?.name || '', unit: item?.unit || '', cat: item?.category || '', qty: 0, price, subtotal: 0 };
      storeData[storeName].items[key].qty += oi.ordered_qty;
      storeData[storeName].items[key].subtotal = storeData[storeName].items[key].qty * price;
    });
  });

  for (const s of Object.values(storeData)) {
    s.total = Object.values(s.items).reduce((sum, it) => sum + it.subtotal, 0);
  }

  const grandTotal = Object.values(storeData).reduce((sum, s) => sum + s.total, 0);
  const noPrice = [];
  Object.values(storeData).forEach(s => Object.values(s.items).forEach(it => { if (!it.price && it.qty > 0 && !noPrice.find(n => n.name === it.name)) noPrice.push(it); }));

  let html = `<div class="section-bar">央廚調撥報表 — ${tcMonth}</div>` + picker;

  if (noPrice.length) {
    html += `<div style="margin:8px 16px;padding:10px 14px;background:#fef3c7;border:1px solid #f59e0b40;border-radius:10px;font-size:13px;color:#92400e">⚠️ ${noPrice.length} 項品項尚未設定單價：${noPrice.map(n => n.name).join('、')}，金額欄顯示 0</div>`;
  }

  html += `<div style="padding:8px 16px"><div style="display:flex;gap:10px;flex-wrap:wrap">`;
  const sortedStores = Object.entries(storeData).sort((a, b) => b[1].total - a[1].total);
  for (const [storeName, data] of sortedStores) {
    const isCool = storeName.startsWith('涼三伯');
    const color = isCool ? '#3b82f6' : '#ef4444';
    html += `<div style="flex:1;min-width:140px;padding:12px 14px;background:${color}08;border:1px solid ${color}25;border-radius:12px;text-align:center"><div style="font-size:13px;font-weight:600;color:${color}">${storeName}</div><div style="font-size:20px;font-weight:700;color:var(--text);margin-top:4px">$${data.total.toLocaleString()}</div></div>`;
  }
  html += `<div style="flex:1;min-width:140px;padding:12px 14px;background:var(--accent-light);border:1px solid var(--accent)25;border-radius:12px;text-align:center"><div style="font-size:13px;font-weight:600;color:var(--accent)">合計</div><div style="font-size:20px;font-weight:700;color:var(--text);margin-top:4px">$${grandTotal.toLocaleString()}</div></div>`;
  html += `</div></div>`;

  for (const [storeName, data] of sortedStores) {
    const isCool = storeName.startsWith('涼三伯');
    const color = isCool ? '#3b82f6' : '#ef4444';
    const itemList = Object.values(data.items);
    const catGroups = {};
    itemList.forEach(it => { const g = tcCat(it.cat); if (!catGroups[g]) catGroups[g] = []; catGroups[g].push(it); });
    html += `<div class="card" style="margin:8px 16px 12px"><div class="card-header"><div class="card-header-left"><div class="card-supplier" style="color:${color}">${storeName}</div><div class="card-date">${itemList.length} 項品項 · 小計 $${data.total.toLocaleString()}</div></div></div>`;
    html += `<div style="padding:0 14px"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="border-bottom:2px solid var(--border)"><th style="text-align:left;padding:8px 4px;color:var(--text2)">品項</th><th style="text-align:right;padding:8px 4px;color:var(--text2)">數量</th><th style="text-align:right;padding:8px 4px;color:var(--text2)">單價</th><th style="text-align:right;padding:8px 4px;color:var(--text2)">小計</th></tr></thead><tbody>`;
    for (const gName of TC_CAT_ORDER) {
      const gItems = catGroups[gName];
      if (!gItems?.length) continue;
      gItems.sort((a, b) => a.name.localeCompare(b.name));
      const gTotal = gItems.reduce((s, it) => s + it.subtotal, 0);
      html += `<tr><td colspan="4" style="padding:8px 4px 4px;font-size:12px;font-weight:700;color:var(--purple);border-bottom:1px solid var(--purple)30">${gName}</td></tr>`;
      for (const it of gItems) {
        const priceStyle = it.price ? '' : 'color:var(--red)';
        html += `<tr style="border-bottom:1px solid var(--border)"><td style="padding:6px 4px">${it.name}</td><td style="text-align:right;padding:6px 4px">${it.qty} ${it.unit}</td><td style="text-align:right;padding:6px 4px;${priceStyle}">${it.price ? '$' + it.price : '未設'}</td><td style="text-align:right;padding:6px 4px;font-weight:600">${it.subtotal ? '$' + it.subtotal.toLocaleString() : '-'}</td></tr>`;
      }
      html += `<tr style="background:var(--surface2)"><td colspan="3" style="padding:5px 4px;font-size:12px;font-weight:600;text-align:right;color:var(--text2)">${gName} 小計</td><td style="text-align:right;padding:5px 4px;font-weight:700;font-size:13px;color:var(--purple)">$${gTotal.toLocaleString()}</td></tr>`;
    }
    html += `<tr style="border-top:2px solid var(--border)"><td colspan="3" style="padding:8px 4px;font-weight:700;text-align:right">合計</td><td style="text-align:right;padding:8px 4px;font-weight:700;font-size:15px;color:${color}">$${data.total.toLocaleString()}</td></tr>`;
    html += `</tbody></table></div></div>`;
  }

  html += `<div style="padding:8px 16px 20px"><button class="card-btn" style="width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid var(--purple);color:var(--purple);background:var(--surface);cursor:pointer" onclick="exportTransferCost()">📊 匯出調撥報表</button></div>`;
  el.innerHTML = html;
}

async function exportTransferCost() {
  const kitchenSupIds = new Set(allSuppliers.filter(s => s.type === 'central_kitchen').map(s => s.id));
  const monthStart = tcMonth + '-01';
  const monthEnd = tcMonth + '-31';
  const [{ data: intOrders }, { data: extOrders }, { data: itemSups }] = await Promise.all([
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', monthStart).lte('order_date', monthEnd).eq('order_type', 'internal').neq('status', 'cancelled'),
    sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', monthStart).lte('order_date', monthEnd).eq('order_type', 'external').neq('status', 'cancelled'),
    sb.from('item_suppliers').select('item_id,supplier_id,unit_price')
  ]);
  const priceMap = {};
  (itemSups || []).forEach(is => { priceMap[is.item_id + '_' + is.supplier_id] = is.unit_price; priceMap[is.item_id] = priceMap[is.item_id] || is.unit_price; });
  const storeOnly = o => o.stores?.type === 'store';
  const orders = [...(intOrders || []).filter(storeOnly)];
  (extOrders || []).filter(storeOnly).forEach(o => {
    const ki = (o.order_items || []).filter(oi => kitchenSupIds.has(oi.supplier_id));
    if (ki.length) orders.push({ ...o, order_items: ki });
  });

  const wb = new ExcelJS.Workbook();
  const storeGroups = {};
  orders.forEach(order => {
    const sn = order.stores?.name || '?';
    if (!storeGroups[sn]) storeGroups[sn] = [];
    (order.order_items || []).filter(oi => oi.status !== 'cancelled').forEach(oi => {
      const item = oi.items;
      const key = item?.id || oi.item_id;
      const price = priceMap[key + '_' + oi.supplier_id] || priceMap[key] || item?.purchase_price || 0;
      const existing = storeGroups[sn].find(r => r.key === key);
      if (existing) { existing.qty += oi.ordered_qty; existing.subtotal = existing.qty * existing.price; }
      else storeGroups[sn].push({ key, name: item?.name || '', unit: item?.unit || '', cat: item?.category || '', qty: oi.ordered_qty, price, subtotal: oi.ordered_qty * price });
    });
  });

  const ws = wb.addWorksheet('央廚調撥');
  ws.columns = [{ header: '門店', width: 14 }, { header: '類別', width: 10 }, { header: '品項', width: 18 }, { header: '數量', width: 10 }, { header: '單位', width: 8 }, { header: '單價', width: 10 }, { header: '小計', width: 12 }];
  ws.getRow(1).font = { bold: true };
  let grandTotal = 0;
  for (const [sn, items] of Object.entries(storeGroups)) {
    let storeTotal = 0;
    for (const gName of TC_CAT_ORDER) {
      const gItems = items.filter(it => tcCat(it.cat) === gName).sort((a, b) => a.name.localeCompare(b.name));
      if (!gItems.length) continue;
      let gTotal = 0;
      gItems.forEach(it => { ws.addRow([sn, gName, it.name, it.qty, it.unit, it.price || '', it.subtotal || '']); gTotal += it.subtotal; });
      ws.addRow(['', gName + ' 小計', '', '', '', '', gTotal]); ws.lastRow.font = { bold: true, color: { argb: 'FF7C3AED' } };
      storeTotal += gTotal;
    }
    ws.addRow([sn, '', '', '', '', '門店合計', storeTotal]);
    ws.lastRow.font = { bold: true };
    grandTotal += storeTotal;
    ws.addRow([]);
  }
  ws.addRow(['', '', '', '', '', '總計', grandTotal]);
  ws.lastRow.font = { bold: true, size: 13 };
  await downloadWorkbook(wb, `央廚調撥_${tcMonth}.xlsx`);
}

// ══════════ PRICE REVIEWS (Admin) ══════════
async function loadPriceReviews() {
  const el = document.getElementById('pricePage');
  el.innerHTML = '<div class="section-bar">價格異動待審核</div><div class="loading">載入中…</div>';
  const [{ data: reviews }, { data: history }] = await Promise.all([
    sb.from('price_reviews').select('*, items(*), stores(*), suppliers(*)').eq('status', 'pending').order('reported_at', { ascending: false }),
    sb.from('price_reviews').select('*, items(*), stores(*), suppliers(*)').in('status', ['approved', 'rejected']).order('reviewed_at', { ascending: false }).limit(30)
  ]);

  const badge = document.getElementById('badge-price');
  if (badge) { badge.style.display = reviews?.length ? 'inline-block' : 'none'; }

  function prCard(pr, showActions) {
    const isNew = pr.old_price == null;
    const diff = isNew ? 0 : pr.new_price - pr.old_price;
    const pct = isNew ? '' : ((diff / pr.old_price) * 100).toFixed(1);
    const isUp = diff > 0;
    const statusBadge = pr.status === 'approved' ? '<span style="color:var(--green);font-weight:600;font-size:12px">✅ 已核准</span>' : pr.status === 'rejected' ? '<span style="color:var(--red);font-weight:600;font-size:12px">❌ 已駁回</span>' : '';
    const reviewDate = pr.reviewed_at ? ' · ' + new Date(pr.reviewed_at).toLocaleDateString('zh-TW') : '';
    return `<div class="pri-item" id="pr-${pr.id}">
      <div class="pri-top"><div class="pri-name">${pr.items?.name || ''}</div><div class="pri-store">${pr.stores?.name || ''} · ${new Date(pr.reported_at).toLocaleDateString('zh-TW')}</div></div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:6px">${pr.suppliers?.name || ''} · ${pr.items?.spec || ''}${!showActions ? ' ' + statusBadge + reviewDate : ''}</div>
      <div class="pri-prices">${isNew ? '<span style="color:var(--text3)">首次設價</span><span style="color:var(--text3)">→</span>' : `<span class="pri-old">$${pr.old_price}</span><span style="color:var(--text3)">→</span>`}<span class="pri-new">$${pr.new_price}</span>${!isNew ? `<span class="pri-diff ${isUp ? 'up' : 'down'}">${isUp ? '↑+' : '↓'}${pct}%</span>` : '<span style="color:var(--blue);font-size:12px;font-weight:600">🆕 新價格</span>'}</div>
      ${showActions ? `<div class="pri-actions"><button class="pri-btn approve" onclick="reviewPrice('${pr.id}','approved')">✓ 核准更新</button><button class="pri-btn reject" onclick="reviewPrice('${pr.id}','rejected')">✗ 駁回</button></div>` : ''}
    </div>`;
  }

  let html = '';
  if (reviews?.length) {
    html += '<div class="section-bar">價格異動待審核（' + reviews.length + ' 筆）</div>' + reviews.map(pr => prCard(pr, true)).join('');
  } else {
    html += '<div class="section-bar">價格異動審核</div><div class="empty-state"><div class="icon">✅</div><div class="msg">目前沒有待審核的價格異動</div></div>';
  }
  if (history?.length) {
    html += '<div class="section-bar" style="margin-top:12px">審核紀錄（近 30 筆）</div>' + history.map(pr => prCard(pr, false)).join('');
  }
  el.innerHTML = html;
}

async function reviewPrice(id, status) {
  const { data: pr } = await sb.from('price_reviews').select('item_id, supplier_id, new_price').eq('id', id).single();
  await sb.from('price_reviews').update({ status, reviewed_by: currentUser.id, reviewed_at: new Date().toISOString() }).eq('id', id);
  if (status === 'approved' && pr) {
    await sb.from('items').update({ purchase_price: pr.new_price }).eq('id', pr.item_id);
    if (pr.supplier_id) {
      await sb.from('item_suppliers').update({ unit_price: pr.new_price }).eq('item_id', pr.item_id).eq('supplier_id', pr.supplier_id);
    }
    const it = allItems.find(i => i.id === pr.item_id);
    if (it) it.purchase_price = pr.new_price;
    if (pr.supplier_id && itemSupplierMap[pr.item_id]) {
      const m = itemSupplierMap[pr.item_id].find(x => x.supplier_id === pr.supplier_id);
      if (m) m.unit_price = pr.new_price;
    }
  }
  const el = document.getElementById('pr-' + id);
  if (status === 'approved') {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:4px 0"><span style="font-size:20px">✅</span><div><div style="font-size:14px;font-weight:600;color:var(--green)">已核准</div><div style="font-size:12px;color:var(--text3)">系統價格已更新</div></div></div>`;
  } else {

// ══════════ FULFILL (Kitchen) ══════════
let fulFrom = getToday(), fulTo = getToday();
function setFulRange(mode) {
  const today = getToday();
  if (mode === 'today') { fulFrom = today; fulTo = today; }
  else if (mode === 'week') { fulFrom = getMonday(today); fulTo = today; }
  else if (mode === 'all') { fulFrom = ''; fulTo = ''; }
  loadFulfill();
}
async function loadFulfill() {
  const el = document.getElementById('fulfillPage');
  const today = getToday();
  const picker = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px"><span style="font-size:13px;color:var(--accent);font-weight:600">日期：</span><input type="date" value="${fulFrom}" onchange="fulFrom=this.value;loadFulfill()" style="padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit"><span style="font-size:13px;color:var(--text3)">～</span><input type="date" value="${fulTo}" onchange="fulTo=this.value;loadFulfill()" style="padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit"><button onclick="setFulRange('today')" style="padding:5px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;background:${fulFrom===today&&fulTo===today?'var(--accent)':'var(--surface)'};color:${fulFrom===today&&fulTo===today?'#fff':'var(--text)'};cursor:pointer;font-family:inherit">今日</button><button onclick="setFulRange('week')" style="padding:5px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;background:${fulFrom===getMonday(today)&&fulTo===today?'var(--accent)':'var(--surface)'};color:${fulFrom===getMonday(today)&&fulTo===today?'#fff':'var(--text)'};cursor:pointer;font-family:inherit">本週</button><button onclick="setFulRange('all')" style="padding:5px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;background:${!fulFrom&&!fulTo?'var(--accent)':'var(--surface)'};color:${!fulFrom&&!fulTo?'#fff':'var(--text)'};cursor:pointer;font-family:inherit">全部</button></div>`;
  el.innerHTML = '<div class="section-bar">待出貨訂單</div>' + picker + '<div class="loading">載入中…</div>';
  let fq = sb.from('orders').select('*, order_items(*, items(*)), stores(*)').eq('order_type', 'internal').in('status', ['submitted', 'confirmed']).order('order_date', { ascending: false });
  if (fulFrom) fq = fq.gte('order_date', fulFrom);
  if (fulTo) fq = fq.lte('order_date', fulTo);
  if (currentUser.store_id) fq = fq.neq('store_id', currentUser.store_id);
  const { data: orders } = await fq;

  if (!orders?.length) { el.innerHTML = '<div class="section-bar">待出貨訂單</div>' + picker + '<div class="empty-state"><div class="icon">📦</div><div class="msg">此區間無待出貨訂單</div></div>'; return; }

  const sn = s => s.replace('麻媽家','').replace('涼三伯','');
  const dateGroups = {};
  orders.forEach(order => {
    const d = order.order_date;
    if (!dateGroups[d]) dateGroups[d] = [];
    dateGroups[d].push(order);
  });
  const sortedDates = Object.keys(dateGroups).sort();

  let totalPending = 0;
  let html = '';

  for (const date of sortedDates) {
    const dayOrders = dateGroups[date];
    const catItems = {};
    const dayOrderIds = new Set();
    const myCats = currentUser.assigned_cats;
    dayOrders.forEach(order => {
      (order.order_items || []).filter(oi => oi.status !== 'fulfilled').forEach(oi => {
        const item = oi.items;
        const cat = item?.category || '其他';
        if (myCats?.length && !myCats.includes(cat)) return;
        const key = item?.id + '_' + date;
        if (!catItems[cat]) catItems[cat] = {};
        if (!catItems[cat][key]) catItems[cat][key] = { name: item?.name || '', unit: item?.unit || '', itemId: item?.id, totalOrdered: 0, stores: [] };
        catItems[cat][key].totalOrdered += oi.ordered_qty;
        catItems[cat][key].stores.push({ store: order.stores?.name || '', ordered: oi.ordered_qty, oiId: oi.id, orderId: order.id });
        dayOrderIds.add(order.id);
      });
    });

    if (!Object.keys(catItems).length) continue;
    const dayPending = Object.values(catItems).reduce((s, c) => s + Object.keys(c).length, 0);
    totalPending += dayPending;

    const dateKey = date.replace(/-/g, '');
    html += `<div style="padding:10px 16px 4px;font-size:14px;font-weight:700;color:var(--purple)">📅 ${date}<span style="font-size:12px;font-weight:400;color:var(--text3);margin-left:8px">${dayOrders.length} 筆</span></div>`;

    for (const [cat, items] of Object.entries(catItems)) {
      const il = Object.values(items);
      html += `<div class="card" style="margin:0 16px 10px"><div class="card-header"><div class="card-header-left"><div class="card-supplier">${cat}</div><div class="card-date">${il.length} 項品項</div></div></div>`;
      for (const it of il) {
        const oiIds = it.stores.map(s => s.oiId);
        html += `<div class="card-row" style="flex-wrap:wrap"><div class="cr-info" style="width:100%;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center"><div class="cr-name">${it.name}<span style="font-size:12px;color:var(--text3);margin-left:6px">叫 ${it.totalOrdered} ${it.unit}</span></div><button onclick="fulfillItem(this,'${date}')" style="padding:3px 10px;border:1.5px solid var(--purple);border-radius:6px;background:transparent;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer">全出 ✓</button></div><div style="display:flex;flex-wrap:wrap;gap:6px;width:100%">${it.stores.map(s => {
          const isCool = s.store.startsWith('涼三伯');
          const color = isCool ? '#3b82f6' : '#ef4444';
          return `<span class="fulfill-store" style="border-color:${color}40;color:${color};display:inline-flex;align-items:center;gap:3px;padding:4px 8px"><span onclick="showOrderDetail('${s.orderId}')" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px">${sn(s.store)}</span><input type="number" class="ful-qty" value="${s.ordered}" data-oiid="${s.oiId}" data-orderid="${s.orderId}" data-ordered="${s.ordered}" data-itemid="${it.itemId}" data-date="${date}" inputmode="decimal" min="0" onfocus="this.select()" oninput="this.style.color=parseFloat(this.value)<parseFloat(this.dataset.ordered)?'var(--red)':'';unmarkFulfillRow(this)" style="width:42px;height:24px;border:1px solid ${color}60;border-radius:4px;text-align:center;font-size:13px;font-weight:600;font-family:inherit;color:${color};background:transparent;outline:none">${it.unit}</span>`;
        }).join('')}</div></div>`;
      }
      html += '</div>';
    }
    html += `<div style="padding:4px 16px 12px"><button class="card-btn btn-purple" data-date="${date}" style="width:100%;padding:12px;border-radius:10px;font-size:15px;font-weight:700;border:none;color:#fff;background:var(--purple);cursor:pointer" onclick="fulfillDay(this,'${date}')">確認 ${date} 出貨</button></div>`;
  }
  html = `<div class="section-bar">待出貨（${sortedDates.length} 天，${totalPending} 項待出）</div>` + picker + html;
  el.innerHTML = html;
}

  body.innerHTML = '<div class="loading">載入中…</div>';

  let h = `<div style="font-size:13px;color:var(--text3);margin-bottom:12px">訂單編號：${order.id.slice(0,8)}… ｜ 狀態：${order.status}</div>`;

  }
  if (isAdmin) {
    h += `<button class="form-save" onclick="saveOrderQtyEdits('${orderId}')" style="margin-top:16px">儲存修改</button>`;
  }
  body.innerHTML = h;
}

async function saveOrderQtyEdits(orderId) {
  const body = document.getElementById('orderDetailBody');
  const inputs = body.querySelectorAll('.od-qty');
  let changed = 0;
  for (const inp of inputs) {
    const newQty = parseFloat(inp.value);
    const orig = parseFloat(inp.dataset.orig);
    if (isNaN(newQty) || newQty < 0 || newQty === orig) continue;
    const { error } = await sb.from('order_items').update({ ordered_qty: newQty }).eq('id', inp.dataset.oiid);
    if (error) { alert('更新失敗：' + error.message); return; }
    changed++;
  }
  if (changed === 0) { closeOrderDetail(); return; }
  closeOrderDetail();
  showModal('✅', '已更新', `修改了 ${changed} 項數量`);
  if (typeof loadFulfill === 'function') loadFulfill();
}

function closeOrderDetail() { document.getElementById('orderDetailOverlay').classList.remove('show'); }

async function fulfillItem(btn, date) {
  const row = btn.closest('.card-row');
  if (!row) return;
  const inputs = row.querySelectorAll('.ful-qty');
  const items = [...inputs].map(inp => ({
    oiId: inp.dataset.oiid, orderId: inp.dataset.orderid, itemId: inp.dataset.itemid,
    qty: parseFloat(inp.value) || 0, ordered: parseFloat(inp.dataset.ordered) || 0
  })).filter(i => i.qty > 0);
  if (!items.length) return;
  btn.disabled = true; btn.textContent = '處理中…';
  try {
    const orderIds = new Set();
    const ledgerRows = [];
    for (const it of items) {
      await sb.from('order_items').update({ fulfilled_qty: it.qty, status: 'fulfilled' }).eq('id', it.oiId);
      orderIds.add(it.orderId);
      if (currentUser.store_id) ledgerRows.push({ store_id: currentUser.store_id, item_id: it.itemId, qty: -it.qty, type: 'fulfill', ref_type: 'order', ref_id: it.orderId });
    }
    if (ledgerRows.length) await sb.from('stock_ledger').insert(ledgerRows);
    for (const orderId of orderIds) {
      const { data: allOi } = await sb.from('order_items').select('status').eq('order_id', orderId);
      if (allOi?.every(oi => oi.status === 'fulfilled' || oi.status === 'received' || oi.status === 'cancelled')) {
        await sb.from('orders').update({ status: 'confirmed', updated_at: new Date().toISOString() }).eq('id', orderId);
      }
    }
    row.style.background = 'rgba(139,92,246,0.08)'; row.style.opacity = '0.3';
    btn.textContent = '已出貨 ✓'; btn.style.background = 'var(--purple)'; btn.style.color = '#fff';
    setTimeout(() => { row.remove(); checkEmptyFulfillCards(); }, 800);
  } catch (err) { alert('出貨失敗：' + err.message); btn.disabled = false; btn.textContent = '全出 ✓'; }
}

function checkEmptyFulfillCards() {
  document.querySelectorAll('#fulfillPage .card').forEach(card => {
    if (!card.querySelectorAll('.card-row').length) card.remove();
  });
}

function unmarkFulfillRow(inp) {
  const row = inp.closest('.card-row');
  if (!row || !row.dataset.confirmed) return;
  delete row.dataset.confirmed;
  row.style.background = '';
  row.style.opacity = '';
  const btn = row.querySelector('button[onclick*="fulfillItem"]');
  if (btn) {
    btn.textContent = '全出 ✓';
    btn.style.background = 'transparent';
    btn.style.color = 'var(--purple)';
    btn.disabled = false;
  }
}

async function fulfillDay(btn, date) {
  const inputs = [...document.querySelectorAll('.ful-qty')].filter(inp => inp.dataset.date === date);

  if (!inputs.length) return;
  const items = inputs.map(inp => ({
    oiId: inp.dataset.oiid,
    orderId: inp.dataset.orderid,
    itemId: inp.dataset.itemid,
    qty: parseFloat(inp.value) || 0,
    ordered: parseFloat(inp.dataset.ordered) || 0
  })).filter(i => i.qty > 0);

  if (!items.length) { alert('沒有要出貨的品項'); return; }
  const short = items.filter(i => i.qty < i.ordered);
  let msg = `確認出貨 ${date} 共 ${items.length} 項？`;
  if (short.length) msg += `\n\n⚠️ ${short.length} 項數量少於叫貨量（短出）`;
  if (!confirm(msg)) return;

  btn.disabled = true; btn.textContent = '處理中…';
  try {
    const orderIds = new Set();
    const ledgerRows = [];
    for (const it of items) {
      await sb.from('order_items').update({ fulfilled_qty: it.qty, status: 'fulfilled' }).eq('id', it.oiId);
      orderIds.add(it.orderId);
      if (currentUser.store_id) {
        ledgerRows.push({ store_id: currentUser.store_id, item_id: it.itemId, qty: -it.qty, type: 'fulfill', ref_type: 'order', ref_id: it.orderId });
      }
    }
    if (ledgerRows.length) {
      const { error: le } = await sb.from('stock_ledger').insert(ledgerRows);
      if (le) console.error('stock_ledger fulfill error:', le);
    }

    for (const orderId of orderIds) {
      const { data: allOi } = await sb.from('order_items').select('status').eq('order_id', orderId);
      const allDone = allOi?.every(oi => oi.status === 'fulfilled' || oi.status === 'received' || oi.status === 'cancelled');
      if (allDone) {
        await sb.from('orders').update({ status: 'confirmed', updated_at: new Date().toISOString() }).eq('id', orderId);
      }
    }

    btn.textContent = '已出貨 ✓'; btn.style.background = 'var(--surface2)'; btn.style.color = 'var(--purple)';
    setTimeout(() => loadFulfill(), 1500);
  } catch (err) { alert('出貨失敗：' + err.message); btn.disabled = false; btn.textContent = `確認 ${date} 出貨`; }
}

async function forceCloseOrder(orderId, btn) {
  if (!confirm('確定強制結單？未出貨的品項將不再出貨，門店也無法再收貨。')) return;
  btn.disabled = true; btn.textContent = '處理中…';
  await sb.from('orders').update({ status: 'received', updated_at: new Date().toISOString() }).eq('id', orderId);
  const { data: ois } = await sb.from('order_items').select('id, ordered_qty, fulfilled_qty, received_qty').eq('order_id', orderId);
  if (ois) {
    for (const oi of ois) {
      const fq = oi.fulfilled_qty || 0;
      const rq = oi.received_qty || 0;
      if (fq > 0 || rq > 0) {
        await sb.from('order_items').update({ status: rq >= (oi.ordered_qty || 0) ? 'received' : 'short' }).eq('id', oi.id);
      } else {
        await sb.from('order_items').update({ status: 'short', fulfilled_qty: 0, received_qty: 0 }).eq('id', oi.id);
      }
    }
  }
  alert('已強制結單');
  document.getElementById('formOverlay')?.remove();
  if (currentTab === 'receive') loadReceive();

async function copyOrder(orderId) {

async function deleteOrderItem(oiId, orderId) {
  if (!confirm('確定刪除此品項？')) return;
  const { data: deleted, error } = await sb.from('order_items').delete().eq('id', oiId).select();

  if (currentTab === 'summary') loadSummary();

async function editReceivedQty(oiId, orderId, itemId, oldQty) {
  const newQty = prompt(`目前收貨數：${oldQty}\n請輸入正確的收貨數量：`, oldQty);
  if (newQty === null) return;
  const nq = parseFloat(newQty);
  if (isNaN(nq) || nq < 0) { alert('請輸入有效數量'); return; }
  if (nq === oldQty) return;
  const { data: order } = await sb.from('orders').select('store_id').eq('id', orderId).single();
  if (!order) { alert('找不到訂單'); return; }
  await sb.from('order_items').update({ received_qty: nq, received_at: new Date().toISOString() }).eq('id', oiId);
  const { data: oldLedger } = await sb.from('stock_ledger').select('id, qty').eq('ref_type', 'order_item').eq('ref_id', oiId);
  const oldTotal = (oldLedger || []).reduce((s, r) => s + r.qty, 0);
  const diff = nq - oldTotal;
  if (diff !== 0) {
    await sb.from('stock_ledger').insert({ store_id: order.store_id, item_id: itemId, qty: diff, type: 'adjust', ref_type: 'rcv_edit', ref_id: oiId });
  }
  showOrderDetail(orderId);
  if (currentTab === 'receive') loadReceive();
  showModal('✅', '收貨數已修正', `${oldQty} → ${nq}，庫存已同步調整`);
}

async function saveOrderEdits(orderId) {
  const overlay = document.getElementById('formOverlay');
  if (!overlay) return;
  const inputs = overlay.querySelectorAll('.edit-qty-input');
  const updates = [];
  const deletes = [];
  inputs.forEach(inp => {
    const qty = parseFloat(inp.value) || 0;
    const oiid = inp.dataset.oiid;
    if (qty > 0) updates.push({ id: oiid, qty });
    else deletes.push(oiid);
  });
  if (!updates.length && deletes.length === inputs.length) { alert('數量不可全部為 0'); return; }
  const btn = overlay.querySelector('.form-save');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    for (const u of updates) {
      const { error } = await sb.from('order_items').update({ ordered_qty: u.qty }).eq('id', u.id);
      if (error) throw error;
    }
    for (const id of deletes) {
      const { data: del } = await sb.from('order_items').delete().eq('id', id).select();
      if (!del?.length) throw new Error('刪除品項失敗：權限不足');
    }
    const { data: remaining } = await sb.from('order_items').select('id').eq('order_id', orderId);
    if (!remaining?.length) {
      await sb.from('orders').update({ status: 'cancelled', updated_at: new Date().toISOString() }).eq('id', orderId);
    }
    overlay.remove();
    if (currentTab === 'history') loadHistory();
    if (currentTab === 'receive') loadReceive();
    if (currentTab === 'summary') loadSummary();
    if (currentTab === 'kitchenSummary') loadKitchenSummary();
    showModal('✅', '訂單已修改', `已更新 ${updates.length} 項${deletes.length ? '，刪除 ' + deletes.length + ' 項' : ''}`);
  } catch (err) { alert('儲存失敗：' + err.message); btn.disabled = false; btn.textContent = '💾 儲存修改'; }
}

async function cancelOrder(orderId, btn) {
  if (!confirm('確定要取消此訂單？已入庫的庫存會同步扣回。')) return;
  btn.disabled = true; btn.textContent = '取消中…';
  const { data: order } = await sb.from('orders').select('store_id, order_items(id, item_id, received_qty)').eq('id', orderId).single();
  const { error } = await sb.from('orders').update({ status: 'cancelled', updated_at: new Date().toISOString() }).eq('id', orderId);
  if (error) { alert('取消失敗：' + error.message); btn.disabled = false; btn.textContent = '取消此訂單'; return; }
  if (order) {
    const oiIds = (order.order_items || []).map(oi => oi.id);
    if (oiIds.length) {
      const { data: ledgerRows } = await sb.from('stock_ledger').select('id, item_id, qty, ref_id').eq('ref_type', 'order_item').in('ref_id', oiIds);
      if (ledgerRows?.length) {
        const reverseRows = ledgerRows.map(r => ({
          store_id: order.store_id, item_id: r.item_id, qty: -r.qty,
          type: 'cancel', ref_type: 'cancel', ref_id: orderId
        }));
        await sb.from('stock_ledger').insert(reverseRows);
      }
    }
  }
  document.getElementById('formOverlay')?.remove();
  if (currentTab === 'history') loadHistory();
  if (currentTab === 'receive') loadReceive();
  showModal('🗑️', '訂單已取消', order?.order_items?.some(oi => oi.received_qty > 0) ? '已入庫的庫存已同步扣回' : '');
}

async function saveItem(itemId) {
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value.trim();
  const unit = document.getElementById('fUnit').value.trim();
  if (!name || !category || !unit) { alert('請填寫名稱、類別和單位'); return; }

  const data = {
    name, category, unit,
    spec: document.getElementById('fSpec').value.trim() || null,
    code: document.getElementById('fCode').value.trim() || null,
    type: document.querySelector('#fType .chip.active')?.dataset.val || 'material',
    brand_scope: document.querySelector('#fScope .chip.active')?.dataset.val || 'ALL',
    purchase_price: parseFloat(document.getElementById('fPrice').value) || null,

    is_active: true
  };

  try {

// ══════════ CSV IMPORT ══════════
async function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const text = await file.text();
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { alert('CSV 檔案為空或格式錯誤'); return; }

  // Parse header
  const header = lines[0].split(',').map(h => h.trim());
  const nameIdx = header.findIndex(h => h.includes('名稱'));
  const catIdx = header.findIndex(h => h.includes('類別'));
  const typeIdx = header.findIndex(h => h.includes('類型'));
  const unitIdx = header.findIndex(h => h.includes('單位'));
  const specIdx = header.findIndex(h => h.includes('規格'));
  const priceIdx = header.findIndex(h => h.includes('進貨價'));
  const supIdx = header.findIndex(h => h.includes('供應商'));
  const scopeIdx = header.findIndex(h => h.includes('品牌'));
  const countIdx = header.findIndex(h => h.includes('盤點'));

  if (nameIdx < 0 || catIdx < 0) { alert('CSV 需包含「名稱」和「類別」欄位'); return; }

  const rows = lines.slice(1).map(line => {
    const cols = line.split(',').map(c => c.trim());
    return {
      name: cols[nameIdx] || '',
      category: cols[catIdx] || '',
      type: cols[typeIdx] || 'material',
      unit: cols[unitIdx] || '個',
      spec: specIdx >= 0 ? cols[specIdx] || null : null,
      purchase_price: priceIdx >= 0 && cols[priceIdx] ? parseFloat(cols[priceIdx]) : null,
      supplier_name: supIdx >= 0 ? cols[supIdx] || null : null,
      brand_scope: scopeIdx >= 0 ? cols[scopeIdx] || 'ALL' : 'ALL',
      needs_count: countIdx >= 0 ? !['否','false','0','no'].includes((cols[countIdx] || '').toLowerCase()) : true
    };
  }).filter(r => r.name);

  if (!rows.length) { alert('沒有有效的品項資料'); return; }

  // Show preview
  const preview = rows.slice(0, 5).map(r => `${r.name}（${r.category}/${r.unit}）`).join('\n');
  const more = rows.length > 5 ? `\n...還有 ${rows.length - 5} 項` : '';
  if (!confirm(`即將匯入 ${rows.length} 項品項：\n\n${preview}${more}\n\n確定？`)) return;

  let success = 0, fail = 0;
  for (const row of rows) {
    try {
      // Insert item
      const { data: newItem, error } = await sb.from('items').insert({
        name: row.name, category: row.category, type: row.type, unit: row.unit,
        spec: row.spec, purchase_price: row.purchase_price,
        brand_scope: row.brand_scope, needs_count: row.needs_count, is_active: true
      }).select().single();

      if (error) { fail++; continue; }

      // Link supplier if specified
      if (row.supplier_name) {
        const sup = allSuppliers.find(s => s.name === row.supplier_name);
        if (sup) {
          await sb.from('item_suppliers').insert({ item_id: newItem.id, supplier_id: sup.id, is_default: true });
        }
      }
      success++;
    } catch { fail++; }
  }

  showModal('📥', '匯入完成', `成功 ${success} 項${fail ? '，失敗 ' + fail + ' 項' : ''}`);
  await loadData();
  loadItemsManagement();
}

// ── Admin: 盤點管理 ──
async function loadCountAdmin() {
  const el = document.getElementById('countPage');
  const { data: sheets } = await sb.from('count_sheets').select('*, stores(name)').order('created_at', { ascending: false });
  const periods = {};
  (sheets || []).forEach(s => {
    if (!periods[s.period]) periods[s.period] = [];
    periods[s.period].push(s);
  });
  const periodKeys = Object.keys(periods).sort().reverse();

  el.innerHTML = `
    <div class="mgmt-bar"><span class="count">${periodKeys.length} 個盤點期</span><button class="add-btn" onclick="openCountPeriod()">＋ 開盤</button></div>
    ${periodKeys.length ? periodKeys.map(p => {
      const ss = periods[p];
      const done = ss.filter(s => s.status === 'approved').length;
      const total = ss.length;
      return `<div class="count-period" onclick="viewCountPeriod('${p}')">
        <div class="count-period-info">
          <div class="count-period-title">${formatPeriod(p)}</div>
          <div class="count-period-sub">${done}/${total} 店已核准</div>
        </div>
        <div class="mi-arrow">›</div>
      </div>`;
    }).join('') : '<div class="empty-state"><div class="icon">📋</div><div class="msg">尚無盤點紀錄</div><div class="msg" style="font-size:12px;color:var(--text3)">點右上角「開盤」建立新的盤點期</div></div>'}`;
}

function formatPeriod(p) {
  const [y, m, half] = p.split('-');
  return `${y}年${parseInt(m)}月${half === '上' ? '月中' : '月底'}`;
}

function getCurrentPeriod() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const half = now.getDate() <= 15 ? '上' : '下';
  return `${y}-${m}-${half}`;
}

async function openCountPeriod() {
  const period = prompt('盤點期別（格式：2026-07-上 或 2026-07-下）', getCurrentPeriod());
  if (!period || !/^\d{4}-\d{2}-(上|下)$/.test(period)) return;

  const stores = allStores.filter(s => s.type === 'store' || s.type === 'warehouse');
  const existing = await sb.from('count_sheets').select('id').eq('period', period);
  if (existing.data?.length) { alert('此期別已存在'); return; }

  try {
    const inserts = stores.map(s => ({ store_id: s.id, period, status: 'pending', created_by: currentUser.id }));
    const { error } = await sb.from('count_sheets').insert(inserts);
    if (error) throw error;
    loadCountAdmin();
  } catch (err) { alert('開盤失敗：' + (err.message || err)); }
}

async function viewCountPeriod(period) {
  const el = document.getElementById('countPage');
  const { data: sheets } = await sb.from('count_sheets').select('*, stores(name)').eq('period', period).order('store_id');

  el.innerHTML = `
    <div class="config-section">
      <div style="display:flex;align-items:center;gap:8px"><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="loadCountAdmin()">←</button><div class="config-section-title">${formatPeriod(period)}</div></div>
      <div class="config-section-sub">各門店盤點進度</div>
    </div>
    ${(sheets || []).map(s => `<div class="count-period" onclick="reviewCountSheet('${s.id}','${period}')">
      <div class="count-period-info">
        <div class="count-period-title">${s.stores?.name || '—'}</div>
        <div class="count-period-sub">${COUNT_STATUS_LABEL[s.status]}</div>
      </div>
      <span class="count-status ${s.status}">${COUNT_STATUS_LABEL[s.status]}</span>
    </div>`).join('')}`;
}

async function reviewCountSheet(sheetId, period) {
  const el = document.getElementById('countPage');
  const { data: sheet } = await sb.from('count_sheets').select('*, stores(name)').eq('id', sheetId).single();
  if (!sheet) return;

  const [{ data: counts }, { data: balances }] = await Promise.all([
    sb.from('inventory_counts').select('*').eq('store_id', sheet.store_id).eq('count_period', period),
    sb.from('stock_balance').select('item_id, qty').eq('store_id', sheet.store_id)
  ]);
  const countMap = {};
  (counts || []).forEach(c => { countMap[c.item_id] = c; });
  const sysMap = {};
  (balances || []).forEach(b => { sysMap[b.item_id] = parseFloat(b.qty) || 0; });

  const items = allItems.filter(i => i.needs_count);
  let totalValue = 0;
  let diffCount = 0;
  items.forEach(i => { if (countMap[i.id]) { totalValue += (countMap[i.id].actual_qty || 0) * (i.purchase_price || 0); if (countMap[i.id].actual_qty !== (sysMap[i.id] || 0)) diffCount++; } });

  const hasData = counts && counts.length > 0;
  const canApprove = sheet.status === 'completed';

  el.innerHTML = `
    <div class="config-section">
      <div style="display:flex;align-items:center;gap:8px"><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="viewCountPeriod('${period}')">←</button><div class="config-section-title">${sheet.stores?.name} — ${formatPeriod(period)}</div></div>
      <div class="config-section-sub">狀態：${COUNT_STATUS_LABEL[sheet.status]}</div>
    </div>
    ${hasData ? `<div class="count-summary">
      <div class="count-summary-row"><span>盤點品項</span><span>${counts.length} 項</span></div>
      <div class="count-summary-row"><span>差異品項</span><span style="color:${diffCount ? 'var(--red)' : 'var(--green)'}">${diffCount} 項</span></div>
      <div class="count-summary-row count-summary-total"><span>盤存金額</span><span>$${totalValue.toLocaleString()}</span></div>
    </div>` : ''}
    ${items.map(item => {
      const c = countMap[item.id];
      const sq = sysMap[item.id] || 0;
      const val = c ? (c.actual_qty * (item.purchase_price || 0)) : 0;
      const diff = c ? c.actual_qty - sq : 0;
      const diffStr = diff > 0 ? '+' + diff : '' + diff;
      return `<div class="count-item">
        <div class="count-item-info"><div class="count-item-name">${item.name}</div><div class="count-item-sub">${item.category} · $${item.purchase_price || 0}/${item.unit} · 系統：${sq}</div></div>
        <div style="text-align:right">${canApprove ? `<input type="number" class="admin-count-input" data-itemid="${item.id}" value="${c ? c.actual_qty : 0}" inputmode="decimal" min="0" step="0.5" style="width:60px;height:32px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:15px;font-weight:600;font-family:inherit">` : `<div style="font-size:16px;font-weight:600">${c ? c.actual_qty : '—'}</div>`}${c && diff !== 0 ? `<div style="font-size:11px;color:${diff > 0 ? 'var(--green)' : 'var(--red)'}">${diffStr}</div>` : `<div style="font-size:11px;color:var(--text3)">${c ? '$' + val.toLocaleString() : ''}</div>`}</div>
      </div>`;
    }).join('')}
    ${canApprove ? `<div style="padding:16px;display:flex;gap:10px">
      <button class="form-save" style="flex:1" onclick="approveSheet('${sheetId}','${period}')">核准此盤點</button>
      <button style="flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid var(--red);color:var(--red);background:transparent;cursor:pointer" onclick="returnSheet('${sheetId}','${period}')">退回重盤</button>
    </div>` : ''}
    ${sheet.status === 'approved' ? '<div style="padding:16px;text-align:center;color:var(--green);font-weight:600">✓ 已核准</div>' : ''}`;
}

async function approveSheet(sheetId, period) {
  if (!confirm('確定核准此門店盤點？核准後數字將鎖定，差異將寫入庫存校正。')) return;
  try {
    const { data: sheet } = await sb.from('count_sheets').select('store_id').eq('id', sheetId).single();
    if (!sheet) throw new Error('找不到盤點單');

    const adminInputs = document.querySelectorAll('.admin-count-input');
    if (adminInputs.length) {
      for (const inp of adminInputs) {
        const itemId = inp.dataset.itemid;
        const newQty = parseFloat(inp.value) || 0;
        await sb.from('inventory_counts').update({ actual_qty: newQty }).eq('store_id', sheet.store_id).eq('count_period', period).eq('item_id', itemId);
      }
    }

    const [{ data: counts }, { data: balances }] = await Promise.all([
      sb.from('inventory_counts').select('item_id, actual_qty').eq('store_id', sheet.store_id).eq('count_period', period),
      sb.from('stock_balance').select('item_id, qty').eq('store_id', sheet.store_id)
    ]);
    const sysMap = {};
    (balances || []).forEach(b => { sysMap[b.item_id] = parseFloat(b.qty) || 0; });

    const adjustRows = [];
    (counts || []).forEach(c => {
      const diff = c.actual_qty - (sysMap[c.item_id] || 0);
      if (diff !== 0) {
        adjustRows.push({ store_id: sheet.store_id, item_id: c.item_id, qty: diff, type: 'adjust', ref_type: 'count_sheet', ref_id: sheetId });
      }
    });
    if (adjustRows.length) await sb.from('stock_ledger').insert(adjustRows);

    const { error } = await sb.from('count_sheets').update({ status: 'approved', completed_at: new Date().toISOString() }).eq('id', sheetId);
    if (error) throw error;
    reviewCountSheet(sheetId, period);
  } catch (err) { alert('核准失敗：' + (err.message || err)); }
}

function enterReturnMode(sheetId, period) {
  const items = document.querySelectorAll('.count-item');
  if (!items.length) return;
  items.forEach(el => {
    const nameEl = el.querySelector('.count-item-name');
    if (!nameEl) return;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'return-flag-cb';
    cb.style.cssText = 'width:18px;height:18px;margin-right:8px;accent-color:var(--red);flex-shrink:0';
    el.style.cursor = 'pointer';
    el.insertBefore(cb, el.firstChild);
    el.onclick = (e) => { if (e.target !== cb) cb.checked = !cb.checked; };
  });
  const btnArea = document.querySelector('#countPage .form-save')?.parentElement;
  if (btnArea) {
    btnArea.innerHTML = `
      <div style="margin-bottom:10px;font-size:13px;color:var(--red);font-weight:600;text-align:center">勾選有問題的品項，門店會看到標記</div>
      <textarea id="returnNote" placeholder="退回原因（選填）" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;font-family:inherit;resize:none;height:50px;margin-bottom:10px"></textarea>
      <div style="display:flex;gap:10px">
        <button style="flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:1px solid var(--border);color:var(--text2);background:transparent;cursor:pointer" onclick="reviewCountSheet('${sheetId}','${period}')">取消</button>
        <button class="form-save" style="flex:1;background:var(--red)" onclick="confirmReturn('${sheetId}','${period}')">確認退回</button>
      </div>`;
  }
}

async function confirmReturn(sheetId, period) {
  const flagged = [];
  document.querySelectorAll('.return-flag-cb:checked').forEach(cb => {
    const nameEl = cb.parentElement.querySelector('.count-item-name');
    if (nameEl) flagged.push(nameEl.textContent.trim());
  });
  const note = document.getElementById('returnNote')?.value?.trim() || '';
  const returnNotes = (flagged.length ? '問題品項：' + flagged.join('、') : '') + (note ? (flagged.length ? '\n' : '') + note : '');

  try {
    const updateData = { status: 'in_progress', completed_at: null };
    if (returnNotes) updateData.return_notes = returnNotes;
    const { error } = await sb.from('count_sheets').update(updateData).eq('id', sheetId);
    if (error) throw error;
    viewCountPeriod(period);
  } catch (err) { alert('退回失敗：' + (err.message || err)); }
}

async function returnSheet(sheetId, period) {
  enterReturnMode(sheetId, period);
}

// ── Store: 門店盤點 ──
async function loadCountStore() {
  const el = document.getElementById('countPage');
  const { data: sheets } = await sb.from('count_sheets').select('*').eq('store_id', currentUser.store_id).order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="mgmt-bar"><span class="count">${(sheets || []).length} 個盤點期</span></div>
    ${(sheets || []).map(s => `<div class="count-period" onclick="${s.status === 'approved' ? `viewStoreCountReadonly('${s.id}','${s.period}')` : `openStoreCount('${s.id}','${s.period}')`}">
      <div class="count-period-info">
        <div class="count-period-title">${formatPeriod(s.period)}</div>
        <div class="count-period-sub">${s.status === 'pending' ? '尚未盤點，點此開始' : s.status === 'in_progress' ? (s.return_notes ? '⚠️ 已退回，請修改後重新送出' : '盤點中，點此繼續') : s.status === 'completed' ? '已送出，等待審核' : '已核准'}</div>
      </div>
      <span class="count-status ${s.status}">${COUNT_STATUS_LABEL[s.status]}</span>
    </div>`).join('') || '<div class="empty-state"><div class="icon">📋</div><div class="msg">目前沒有盤點任務</div></div>'}`;
}

async function openStoreCount(sheetId, period) {
  const el = document.getElementById('countPage');
  const items = allItems.filter(i => i.needs_count);

  const [{ data: existing }, { data: balances }, { data: sheet }] = await Promise.all([
    sb.from('inventory_counts').select('*').eq('store_id', currentUser.store_id).eq('count_period', period),
    sb.from('stock_balance').select('item_id, qty').eq('store_id', currentUser.store_id),
    sb.from('count_sheets').select('return_notes').eq('id', sheetId).single()
  ]);
  const saved = {};
  (existing || []).forEach(c => { saved[c.item_id] = c; });
  const sysQty = {};
  (balances || []).forEach(b => { sysQty[b.item_id] = parseFloat(b.qty) || 0; });

  await sb.from('count_sheets').update({ status: 'in_progress' }).eq('id', sheetId).in('status', ['pending', 'in_progress']);

  const cats = ['ALL', ...new Set(items.map(i => i.category))];
  window._countSheetId = sheetId;
  window._countPeriod = period;
  window._countSaved = saved;
  window._countSysQty = sysQty;
  window._countCat = 'ALL';
  window._countReturnNotes = sheet?.return_notes || '';

  renderStoreCount(el, items, cats);
}

function renderStoreCount(el, items, cats) {
  const saved = window._countSaved;
  const cat = window._countCat;
  const filtered = cat === 'ALL' ? items : items.filter(i => i.category === cat);
  const rn = window._countReturnNotes || '';
  const flaggedNames = [];
  if (rn) {
    const m = rn.match(/問題品項：(.+)/);
    if (m) m[1].split('、').forEach(n => flaggedNames.push(n.trim()));
  }

  el.innerHTML = `
    <div class="config-section">
      <div style="display:flex;align-items:center;gap:8px"><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="loadCountStore()">←</button><div class="config-section-title">${formatPeriod(window._countPeriod)}</div></div>
      <div class="config-section-sub">填寫各品項實際庫存數量</div>
    </div>
    ${rn ? `<div style="margin:8px 16px;padding:12px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px"><div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:4px">退回重盤</div><div style="font-size:12px;color:#991b1b;white-space:pre-line">${rn}</div></div>` : ''}
    <div class="cat-filter" style="padding:10px 16px">${cats.map(c => `<button class="cat-btn ${cat === c ? 'active' : ''}" onclick="window._countCat='${c}';renderStoreCount(document.getElementById('countPage'),allItems.filter(i=>i.needs_count),${JSON.stringify(cats).replace(/"/g, "'")})">${c === 'ALL' ? '全部' : c}</button>`).join('')}</div>
    <div class="count-bar" style="padding:6px 16px;font-size:12px;color:var(--text3)">${filtered.length} 項品項</div>
    ${filtered.map(item => {
      const s = saved[item.id];
      const sq = (window._countSysQty || {})[item.id] || 0;
      const isFlagged = flaggedNames.includes(item.name);
      return `<div class="count-item" style="${isFlagged ? 'background:#fef2f2;border-left:3px solid var(--red)' : ''}">
        <div class="count-item-info"><div class="count-item-name">${isFlagged ? '⚠️ ' : ''}${item.name}</div><div class="count-item-sub">${item.category} · ${item.unit}${item.purchase_price ? ' · $' + item.purchase_price : ''}</div><div style="font-size:11px;color:var(--purple);margin-top:2px">系統庫存：${sq} ${item.unit}</div></div>
        <input type="number" class="count-input" id="ci_${item.id}" value="${s ? s.actual_qty : ''}" placeholder="0" inputmode="decimal" min="0" step="0.5" data-sys="${sq}" oninput="let d=document.getElementById('cd_${item.id}');if(d){let v=parseFloat(this.value)||0,diff=v-${sq};d.textContent=diff>0?'+'+diff:diff;d.style.color=diff===0?'var(--text3)':diff>0?'var(--green)':'var(--red)'}">
        <div class="count-unit">${item.unit}</div>
        <div id="cd_${item.id}" style="font-size:11px;min-width:36px;text-align:right;color:var(--text3)">${s ? (s.actual_qty - sq > 0 ? '+' : '') + (s.actual_qty - sq) : ''}</div>
      </div>`;
    }).join('')}
    <div style="padding:16px"><button class="form-save" onclick="submitStoreCount()">送出盤點</button></div>`;
}

async function submitStoreCount() {
  const items = allItems.filter(i => i.needs_count);
  const rows = [];
  let empty = 0;
  items.forEach(item => {
    const input = document.getElementById('ci_' + item.id);
    if (!input) return;
    const val = parseFloat(input.value);
    if (isNaN(val)) { empty++; return; }
    const sq = (window._countSysQty || {})[item.id] || 0;
    rows.push({ store_id: currentUser.store_id, item_id: item.id, count_period: window._countPeriod, system_qty: sq, actual_qty: val, counted_by: currentUser.id });
  });

  if (empty > 0 && !confirm(`有 ${empty} 項未填（將視為 0），確定送出？`)) return;
  items.forEach(item => {
    if (!rows.find(r => r.item_id === item.id)) {
      const sq = (window._countSysQty || {})[item.id] || 0;
      rows.push({ store_id: currentUser.store_id, item_id: item.id, count_period: window._countPeriod, system_qty: sq, actual_qty: 0, counted_by: currentUser.id });
    }
  });

  try {
    // Delete old counts for this period/store then insert
    await sb.from('inventory_counts').delete().eq('store_id', currentUser.store_id).eq('count_period', window._countPeriod);
    const { error } = await sb.from('inventory_counts').insert(rows);
    if (error) throw error;

    await sb.from('count_sheets').update({ status: 'completed', completed_at: new Date().toISOString(), return_notes: null }).eq('id', window._countSheetId);
    alert('盤點已送出！');
    loadCountStore();
  } catch (err) { alert('送出失敗：' + (err.message || err)); }
}

async function viewStoreCountReadonly(sheetId, period) {
  const el = document.getElementById('countPage');
  const items = allItems.filter(i => i.needs_count);
  const { data: counts } = await sb.from('inventory_counts').select('*').eq('store_id', currentUser.store_id).eq('count_period', period);
  const countMap = {};
  (counts || []).forEach(c => { countMap[c.item_id] = c; });

  let totalValue = 0;
  items.forEach(i => { if (countMap[i.id]) totalValue += (countMap[i.id].actual_qty || 0) * (i.purchase_price || 0); });

  el.innerHTML = `
    <div class="config-section">
      <div style="display:flex;align-items:center;gap:8px"><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="loadCountStore()">←</button><div class="config-section-title">${formatPeriod(period)}</div></div>
      <div class="config-section-sub">已核准 · 盤存金額 $${totalValue.toLocaleString()}</div>
    </div>
    ${items.map(item => {
      const c = countMap[item.id];
      return `<div class="count-item">
        <div class="count-item-info"><div class="count-item-name">${item.name}</div><div class="count-item-sub">${item.category} · ${item.unit}</div></div>
        <div style="text-align:right;font-size:16px;font-weight:600">${c ? c.actual_qty : 0}</div>
        <div class="count-unit">${item.unit}</div>
      </div>`;
    }).join('')}`;
}

// ══════════ CONSUME (領料) ══════════
let consumeCart = {};

async function loadConsume() {
  const el = document.getElementById('consumePage');
  const storeId = currentUser.store_id;
  if (!storeId) { el.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="msg">請先選擇門店</div></div>'; return; }

  const { data: balances } = await sb.from('stock_balance').select('item_id, qty').eq('store_id', storeId);
  const balMap = {};
  (balances || []).forEach(b => { balMap[b.item_id] = b.qty; });

  const inStockItems = allItems.filter(i => (balMap[i.id] || 0) > 0);
  const cats = ['ALL', ...new Set(inStockItems.map(i => i.category))];
  const currentCatC = window._consumeCat || 'ALL';

  const { data: recent } = await sb.from('stock_ledger').select('*, items(name, unit)').eq('store_id', storeId).eq('type', 'consume').order('created_at', { ascending: false }).limit(20);

  let html = '<div class="section-bar">領料出庫</div>';
  html += '<div class="cat-filter" style="padding:8px 16px">' + cats.map(c =>
    `<button class="cat-btn ${currentCatC === c ? 'active' : ''}" onclick="window._consumeCat='${c}';renderConsumeItems()">${c === 'ALL' ? '全部' : c}</button>`
  ).join('') + '</div>';
  html += '<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="search" class="search-input" id="consumeSearch" placeholder="搜尋品項…" oninput="renderConsumeItems()"></div>';
  html += '<div id="consumeItemList"></div>';
  html += '<div id="consumeFloat" class="cart-float hidden" onclick="submitConsume()"><span>確認領料</span><span class="cart-badge" id="consumeBadge">0 項</span></div>';

  if (recent?.length) {
    html += '<div class="section-bar" style="margin-top:20px">近期領料紀錄</div>';
    recent.forEach(r => {
      const d = new Date(r.created_at);
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:1px solid var(--border)"><div><div style="font-size:13px;font-weight:600">${r.items?.name || ''}</div><div style="font-size:11px;color:var(--text3)">${d.toLocaleDateString('zh-TW')} ${d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}</div></div><div style="font-size:14px;font-weight:600;color:var(--red)">${Math.abs(r.qty)} ${r.items?.unit || ''}</div></div>`;
    });
  }

  el.innerHTML = html;
  window._consumeBalMap = balMap;
  window._consumeInStockItems = inStockItems;
  consumeCart = {};
  renderConsumeItems();
}

function renderConsumeItems() {
  const q = (document.getElementById('consumeSearch')?.value || '').toLowerCase();
  const cat = window._consumeCat || 'ALL';
  const balMap = window._consumeBalMap || {};
  const items = (window._consumeInStockItems || []).filter(i => {
    if (cat !== 'ALL' && i.category !== cat) return false;
    if (q && !i.name.toLowerCase().includes(q)) return false;
    return true;
  });
  const list = document.getElementById('consumeItemList');
  if (!list) return;
  list.innerHTML = items.map(item => {
    const stock = balMap[item.id] || 0;
    const qty = consumeCart[item.id] || 0;
    return `<div class="order-item ${qty ? 'in-cart' : ''}" style="padding:10px 16px"><div class="oi-info"><div class="oi-name">${item.name}</div><div class="oi-spec"><span class="oi-unit-tag">${item.unit}</span> 庫存 ${stock}</div></div><div class="oi-qty"><button class="qty-btn minus" onclick="adjConsume('${item.id}',-1)">−</button><input type="number" class="qty-input ${qty ? 'has-value' : ''}" value="${qty || ''}" placeholder="0" inputmode="decimal" onfocus="this.select()" onchange="setConsumeQty('${item.id}',this.value)"><button class="qty-btn plus" onclick="adjConsume('${item.id}',1)">+</button></div></div>`;
  }).join('') || '<div class="empty-state"><div class="icon">📦</div><div class="msg">目前沒有庫存品項</div></div>';
}

function adjConsume(id, d) {
  const cur = consumeCart[id] || 0;
  const max = (window._consumeBalMap || {})[id] || 0;
  const n = Math.max(0, Math.min(max, cur + d));
  if (!n) delete consumeCart[id]; else consumeCart[id] = n;
  updConsumeFloat();
  renderConsumeItems();
}

function setConsumeQty(id, v) {
  const n = parseFloat(v) || 0;
  const max = (window._consumeBalMap || {})[id] || 0;
  if (n <= 0) delete consumeCart[id]; else consumeCart[id] = Math.min(n, max);
  updConsumeFloat();
  renderConsumeItems();
}

function updConsumeFloat() {
  const n = Object.keys(consumeCart).length;
  const el = document.getElementById('consumeFloat');
  if (el) { el.classList.toggle('hidden', n === 0); document.getElementById('consumeBadge').textContent = n + ' 項'; }
}

async function submitConsume() {
  const entries = Object.entries(consumeCart);
  if (!entries.length) return;
  if (!confirm('確認領料 ' + entries.length + ' 項？庫存將直接扣除。')) return;
  const storeId = currentUser.store_id;
  const rows = entries.map(([itemId, qty]) => ({
    store_id: storeId, item_id: itemId, qty: -qty, type: 'consume', ref_type: 'manual', ref_id: null
  }));
  const { error } = await sb.from('stock_ledger').insert(rows);
  if (error) { alert('領料失敗：' + error.message); return; }
  alert('領料完成，已扣除 ' + entries.length + ' 項庫存');
  consumeCart = {};
  loadConsume();
}

// ══════════ TRANSFERS (調撥紀錄) ══════════
let transferFilter = 'all';

async function loadTransfer() {
  const el = document.getElementById('transferPage');
  const isAdmin = currentUser.role === 'admin';

  const { data: transfers, error } = await sb.from('transfers').select('*, from_store:stores!transfers_from_store_id_fkey(name), to_store:stores!transfers_to_store_id_fkey(name), requester:users!transfers_requested_by_fkey(name)').order('requested_at', { ascending: false }).limit(100);
  if (error) { el.innerHTML = `<div class="empty-state"><div class="msg">載入失敗：${error.message}</div></div>`; return; }

  const all = transfers || [];
  const unreturned = all.filter(t => t.status === 'active');
  const returned = all.filter(t => t.status === 'returned');
  const shown = transferFilter === 'pending' ? unreturned : transferFilter === 'history' ? returned : all;

  el.innerHTML = `
    <div class="mgmt-bar"><span class="count">${unreturned.length} 筆未歸還</span><button class="add-btn" onclick="openTransferForm()">＋ 新增調撥</button></div>
    <div class="tf-type-tabs">
      <button class="tf-type-tab ${transferFilter === 'all' ? 'active' : ''}" onclick="transferFilter='all';loadTransfer()">全部 (${all.length})</button>
      <button class="tf-type-tab ${transferFilter === 'pending' ? 'active' : ''}" onclick="transferFilter='pending';loadTransfer()">未歸還 (${unreturned.length})</button>
      <button class="tf-type-tab ${transferFilter === 'history' ? 'active' : ''}" onclick="transferFilter='history';loadTransfer()">已歸還 (${returned.length})</button>
    </div>
    ${shown.length ? shown.map(t => `<div class="tf-card">
      <div class="tf-card-top">
        <div><span class="tf-card-stores">${t.from_store?.name || '?'}</span><span class="tf-card-arrow">→</span><span class="tf-card-stores">${t.to_store?.name || '?'}</span></div>
        <span class="tf-badge ${t.status === 'returned' ? 'received' : 'requested'}">${t.status === 'returned' ? '已歸還' : '未歸還'}</span>
      </div>
      <div class="tf-card-items">${t.note || '（無描述）'}</div>
      <div class="tf-card-meta">
        ${t.requester?.name || ''} · ${new Date(t.requested_at).toLocaleDateString('zh-TW')}
        ${t.received_at ? ' · 歸還於 ' + new Date(t.received_at).toLocaleDateString('zh-TW') : ''}
      </div>
      ${t.status === 'active' && (isAdmin || currentUser.store_id === t.from_store_id || currentUser.store_id === t.to_store_id) ? `<div style="margin-top:8px"><button class="tf-btn-green" style="padding:6px 16px;font-size:13px;border:none;border-radius:8px;cursor:pointer" onclick="event.stopPropagation();markReturned('${t.id}')">標記已歸還</button></div>` : ''}
    </div>`).join('') : '<div class="empty-state"><div class="icon">📦</div><div class="msg">沒有調撥紀錄</div></div>'}`;
}

function openTransferForm() {
  const myStoreId = currentUser.store_id;

  const stores = allStores.filter(s => s.type === 'store');

  document.getElementById('formOverlay')?.remove();

          </div></div>
        `}
        <div class="form-group"><label class="form-label">調撥內容 *</label>
          <textarea class="form-input" id="tfNote" rows="3" placeholder="例：涼皮 ×10、麻醬包 ×20" style="resize:vertical;font-family:inherit"></textarea></div>

      </div>

}

function closeTransferForm() { document.getElementById('formOverlay')?.remove(); }

async function submitTransfer() {
  const isAdmin = currentUser.role === 'admin';
  let fromId, toId;

  if (isAdmin) {
    fromId = document.getElementById('tfFrom').value;
    toId = document.getElementById('tfTo').value;
    if (!fromId || !toId) { alert('請選擇借出和借入門店'); return; }
    if (fromId === toId) { alert('借出和借入不能是同一門店'); return; }
  } else {
    const targetId = document.getElementById('tfTarget').value;
    if (!targetId) { alert('請選擇對方門店'); return; }
    const dir = document.querySelector('#tfDir .chip.active')?.dataset.val || 'out';
    fromId = dir === 'out' ? currentUser.store_id : targetId;
    toId = dir === 'out' ? targetId : currentUser.store_id;
  }

  const note = document.getElementById('tfNote').value.trim();
  if (!note) { alert('請填寫調撥內容'); return; }

  const { error } = await sb.from('transfers').insert({
    from_store_id: fromId, to_store_id: toId,
    type: 'transfer', status: 'active',
    requested_by: currentUser.id, note
  });
  if (error) { alert('建立失敗：' + error.message); return; }

  closeTransferForm();
  alert('已建立調撥紀錄');
  loadTransfer();
}

async function markReturned(tfId) {
  if (!confirm('確定標記為已歸還？')) return;
  const { error } = await sb.from('transfers').update({ status: 'returned', received_at: new Date().toISOString() }).eq('id', tfId);
  if (error) { alert('更新失敗：' + error.message); return; }
  loadTransfer();
}

function openSupplierForm(supId) {

      <div class="form-body">
        <div class="form-group"><label class="form-label">廠商名稱 *</label><input class="form-input" id="fsName" value="${sup?.name || ''}" placeholder="例：可果坊"></div>
        <div class="form-group"><label class="form-label">類型</label>

        ${isEdit ? `<button class="form-delete" onclick="deleteSupplier('${supId}')">停用此廠商</button>` : ''}
      </div>

  overlay.addEventListener('click', e => { if (e.target === overlay) closeSupplierForm(); });
}

function closeSupplierForm() { document.getElementById('formOverlay')?.remove(); }

async function saveSupplier(supId) {
  const name = document.getElementById('fsName').value.trim();
  if (!name) { alert('請填寫廠商名稱'); return; }

  const data = {
    name,
    type: document.querySelector('#fsType .chip.active')?.dataset.val || 'external',
    payment_method: document.querySelector('#fsPayment .chip.active')?.dataset.val || 'cash',
    note: document.getElementById('fsNote').value.trim() || null,
    is_active: true
  };

  try {
    let savedId = supId;
    if (supId) {
      const { error } = await sb.from('suppliers').update(data).eq('id', supId);
      if (error) throw error;
    } else {
      const { data: newSup, error } = await sb.from('suppliers').insert(data).select().single();
      if (error) throw error;
      savedId = newSup.id;

      // Auto-create store_suppliers for all stores (default on)
      const stores = allStores.filter(s => s.type === 'store');
      if (stores.length) {
        await sb.from('store_suppliers').insert(stores.map(s => ({ store_id: s.id, supplier_id: savedId, is_active: true })));
      }
    }

    closeSupplierForm();
    await loadData();
    loadSuppliers();
  } catch (err) { alert('儲存失敗：' + (err.message || err)); }
}

async function deleteSupplier(supId) {
  if (!confirm('確定要停用此廠商？停用後門店將無法向此廠商叫貨。')) return;
  try {
    await sb.from('suppliers').update({ is_active: false }).eq('id', supId);
    closeSupplierForm();
    await loadData();
    loadSuppliers();
  } catch (err) { alert('停用失敗：' + (err.message || err)); }
}

function getExpFilters() {
  return {
    from: document.getElementById('expFrom').value,
    to: document.getElementById('expTo').value,
    storeId: document.getElementById('expStore').value || null,
    supId: document.getElementById('expSup').value || null
  };
}

function styleHeader(ws) {
  const row = ws.getRow(1);
  row.eachCell(c => {
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2E7D56' } };
    c.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
    c.alignment = { horizontal: 'center', vertical: 'middle' };
    c.border = { bottom: { style: 'thin', color: { argb: 'FF999999' } } };
  });
  row.height = 28;
}

async function downloadWorkbook(wb, name) {
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

async function exportPurchaseSummary() {
  const f = getExpFilters();
  let query = sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', f.from).lte('order_date', f.to).in('status', ['submitted', 'confirmed', 'received']);
  if (f.storeId) query = query.eq('store_id', f.storeId);
  const { data: orders } = await query;
  if (!orders?.length) { alert('該期間無資料'); return; }

  const rows = [];
  orders.forEach(o => (o.order_items || []).forEach(oi => {
    if (f.supId && oi.supplier_id !== f.supId) return;
    const item = oi.items;
    const supMap = (itemSupplierMap[item?.id] || []).find(m => m.supplier_id === oi.supplier_id);
    const price = supMap?.unit_price || item?.purchase_price || null;
    rows.push({
      date: o.order_date, store: o.stores?.name || '', sup: getSupplierName(oi.supplier_id) || '未指定',
      cat: item?.category || '', name: item?.name || '', spec: item?.spec || '',
      unit: item?.unit || '', qty: oi.ordered_qty, price, total: price ? oi.ordered_qty * price : null
    });
  }));

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('月度採購彙總');
  ws.columns = [
    { header: '日期', key: 'date', width: 12 },
    { header: '門店', key: 'store', width: 14 },
    { header: '廠商', key: 'sup', width: 14 },
    { header: '類別', key: 'cat', width: 10 },
    { header: '品項', key: 'name', width: 18 },
    { header: '規格', key: 'spec', width: 14 },
    { header: '單位', key: 'unit', width: 8 },
    { header: '數量', key: 'qty', width: 10 },
    { header: '單價', key: 'price', width: 10 },
    { header: '金額', key: 'total', width: 12 }
  ];
  styleHeader(ws);
  rows.sort((a, b) => a.date.localeCompare(b.date) || a.store.localeCompare(b.store) || a.sup.localeCompare(b.sup)).forEach(r => ws.addRow(r));
  ws.getColumn('qty').numFmt = '#,##0.##';
  ws.getColumn('price').numFmt = '#,##0';
  ws.getColumn('total').numFmt = '#,##0';
  await downloadWorkbook(wb, `採購彙總_${f.from}_${f.to}.xlsx`);
}

async function exportOrderDetail() {
  const f = getExpFilters();
  let query = sb.from('orders').select('*, order_items(*, items(*)), stores(*)').gte('order_date', f.from).lte('order_date', f.to).order('order_date', { ascending: true });
  if (f.storeId) query = query.eq('store_id', f.storeId);
  const { data: orders } = await query;
  if (!orders?.length) { alert('該期間無資料'); return; }

  const sm = { draft:'草稿', submitted:'已送出', confirmed:'已確認', received:'已收貨', cancelled:'已取消' };
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('叫貨明細');
  ws.columns = [
    { header: '日期', key: 'date', width: 12 },
    { header: '門店', key: 'store', width: 14 },
    { header: '品項', key: 'name', width: 18 },
    { header: '供應商', key: 'sup', width: 14 },
    { header: '叫貨數量', key: 'ordered', width: 12 },
    { header: '收貨數量', key: 'received', width: 12 },

async function exportCountReport() {
  const f = getExpFilters();
  let query = sb.from('inventory_counts').select('*, items(*), stores(*)').gte('count_period', f.from.slice(0, 7)).lte('count_period', f.to.slice(0, 7));
  if (f.storeId) query = query.eq('store_id', f.storeId);
  const { data: counts } = await query;
  if (!counts?.length) { alert('該期間無盤點資料'); return; }

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('盤點報表');
  ws.columns = [
    { header: '盤點期間', key: 'period', width: 12 },
    { header: '門店', key: 'store', width: 14 },
    { header: '品項', key: 'name', width: 18 },
    { header: '類別', key: 'cat', width: 10 },
    { header: '單位', key: 'unit', width: 8 },
    { header: '系統數量', key: 'sys', width: 12 },
    { header: '實際數量', key: 'actual', width: 12 },
    { header: '差異', key: 'diff', width: 10 }
  ];
  styleHeader(ws);
  counts.forEach(c => {
    const diff = (c.actual_qty || 0) - (c.system_qty || 0);
    ws.addRow({
      period: c.count_period, store: c.stores?.name || '', name: c.items?.name || '',
      cat: c.items?.category || '', unit: c.items?.unit || '',
      sys: c.system_qty, actual: c.actual_qty, diff
    });
  });
  ws.getColumn('sys').numFmt = '#,##0.##';
  ws.getColumn('actual').numFmt = '#,##0.##';
  ws.getColumn('diff').numFmt = '#,##0.##';
  ws.eachRow((row, i) => {
    if (i > 1) {
      const d = row.getCell('diff').value;
      if (d && d !== 0) row.getCell('diff').font = { color: { argb: d < 0 ? 'FFC0392B' : 'FF2E7D56' }, bold: true };
