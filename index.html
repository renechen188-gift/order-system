let stockStoreId = null;
async function loadStock() {
  const el = document.getElementById('stockPage');
  const isAdmin = currentUser.role === 'admin';
  const storeId = isAdmin ? stockStoreId : currentUser.store_id;

  const storeOpts = allStores.filter(s => s.is_active).map(s => `<option value="${s.id}" ${stockStoreId === s.id ? 'selected' : ''}>${s.name}</option>`).join('');
  const picker = isAdmin ? `<div style="padding:12px 16px 4px;display:flex;align-items:center;gap:8px"><span style="font-size:13px;color:var(--text3)">查詢門店：</span><select class="oi-sup-select" style="flex:1;padding:8px 10px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface1)" onchange="stockStoreId=this.value;loadStock()"><option value="">請選擇</option>${storeOpts}</select></div>` : '';

  if (!storeId) {
    el.innerHTML = `<div class="section-bar">庫存查詢</div>${picker}<div class="empty-state"><div class="icon">📦</div><div class="msg">請選擇門店</div></div>`;
    return;
  }

  el.innerHTML = `<div class="section-bar">庫存查詢</div>${picker}<div class="loading">載入中…</div>`;
  const { data: balances, error: balErr } = await sb.from('stock_balance').select('item_id, qty').eq('store_id', storeId);
  if (balErr) console.error('stock_balance query failed:', balErr);
  const balMap = {};
  (balances || []).forEach(b => { balMap[b.item_id] = parseFloat(b.qty) || 0; });

  const items = allItems.filter(i => i.needs_count);
  const cats = {};
  items.forEach(i => {
    const cat = i.category || '其他';
    if (!cats[cat]) cats[cat] = [];
    cats[cat].push(i);
  });

  const storeName = getStoreName(storeId);
  const showAll = window._stockShowAll || false;
  const hasStock = items.filter(i => (balMap[i.id] || 0) !== 0);
  const displayItems = showAll ? items : hasStock;
  const displayCats = {};
  displayItems.forEach(i => {
    const cat = i.category || '其他';
    if (!displayCats[cat]) displayCats[cat] = [];
    displayCats[cat].push(i);
  });

  let html = `<div class="section-bar">庫存查詢</div>${picker}<div style="padding:8px 16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;color:var(--text3)">${storeName} · ${displayItems.length} 項品項${!showAll && hasStock.length < items.length ? '（有庫存）' : ''}</span><label style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" ${showAll ? 'checked' : ''} onchange="window._stockShowAll=this.checked;loadStock()"> 顯示全部</label></div>`;
  for (const [cat, citems] of Object.entries(displayCats)) {
    html += `<div style="padding:6px 16px 2px;font-size:12px;font-weight:700;color:var(--text3);letter-spacing:1px">${cat}</div>`;
    citems.forEach(item => {
      const qty = balMap[item.id] || 0;
      const color = qty > 0 ? 'var(--green)' : qty < 0 ? 'var(--red)' : 'var(--text3)';
      html += `<div class="count-item" style="cursor:pointer" onclick="toggleStockDetail(this,'${item.id}','${storeId}')">
        <div class="count-item-info"><div class="count-item-name">${item.name}</div><div class="count-item-sub">${item.unit}${item.purchase_price ? ' · $' + item.purchase_price : ''}</div></div>
        <div style="text-align:right"><div style="font-size:18px;font-weight:700;color:${color}">${qty}</div><div style="font-size:11px;color:var(--text3)">${item.unit}</div></div>
      </div>`;
    });
  }
  el.innerHTML = html;
}

async function toggleStockDetail(el, itemId, storeId) {
  const existing = el.nextElementSibling;
  if (existing?.classList?.contains('stock-detail')) { existing.remove(); return; }
  const { data: logs } = await sb.from('stock_ledger').select('id, qty, type, created_at').eq('store_id', storeId).eq('item_id', itemId).order('created_at', { ascending: false }).limit(20);
  if (!logs?.length) return;
  const typeLabel = { receive: '📥 收貨', fulfill: '📤 出貨', adjust: '🔧 校正', initial: '📋 期初', consume: '🍳 領料', cancel: '🚫 取消沖銷' };
  const isAdmin = currentUser?.role === 'admin';
  const detail = document.createElement('div');
  detail.className = 'stock-detail';
  detail.style.cssText = 'padding:4px 16px 12px 32px;background:var(--surface2);border-bottom:1px solid var(--border)';
  detail.innerHTML = logs.map(l => {
    const color = l.qty > 0 ? 'var(--green)' : 'var(--red)';
    const sign = l.qty > 0 ? '+' : '';
    const delBtn = isAdmin ? `<button onclick="deleteStockEntry('${l.id}',this)" style="margin-left:8px;padding:1px 6px;font-size:11px;border:1px solid var(--red);border-radius:4px;background:transparent;color:var(--red);cursor:pointer">刪除</button>` : '';
    return `<div class="sl-row" style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px"><div><span style="margin-right:6px">${typeLabel[l.type] || l.type}</span><span style="color:var(--text3)">${l.created_at?.split('T')[0] || ''}</span>${delBtn}</div><span style="font-weight:600;color:${color}">${sign}${l.qty}</span></div>`;
  }).join('');
  el.after(detail);
}

async function deleteStockEntry(id, btn) {
  if (!confirm('確定刪除這筆庫存紀錄？刪除後餘額會即時更新')) return;
  btn.disabled = true; btn.textContent = '…';
  const { error } = await sb.from('stock_ledger').delete().eq('id', id);
  if (error) { alert('刪除失敗：' + error.message); btn.disabled = false; btn.textContent = '刪除'; return; }
  const row = btn.closest('.sl-row');
  if (row) { row.style.opacity = '0.3'; row.style.textDecoration = 'line-through'; btn.remove(); }
  loadStock();
}

async function exportStockSummary() {
  const f = getExpFilters();
  const stores = f.storeId ? allStores.filter(s => s.id === f.storeId) : allStores.filter(s => s.is_active);
  const items = allItems.filter(i => i.needs_count);

  let lq = sb.from('stock_ledger').select('store_id, item_id, qty, type').gte('created_at', f.from + 'T00:00:00').lte('created_at', f.to + 'T23:59:59');
  if (f.storeId) lq = lq.eq('store_id', f.storeId);
  const { data: ledger } = await lq;
  if (!ledger?.length) { alert('該期間無庫存資料'); return; }

  const key = (sid, iid) => sid + '|' + iid;
  const agg = {};
  (ledger || []).forEach(r => {
    const k = key(r.store_id, r.item_id);
    if (!agg[k]) agg[k] = { store_id: r.store_id, item_id: r.item_id, receive: 0, fulfill: 0, adjust: 0 };
    if (r.type === 'receive') agg[k].receive += parseFloat(r.qty) || 0;
    else if (r.type === 'fulfill') agg[k].fulfill += parseFloat(r.qty) || 0;
    else if (r.type === 'adjust') agg[k].adjust += parseFloat(r.qty) || 0;
  });

  let pq = sb.from('stock_ledger').select('store_id, item_id, qty').lt('created_at', f.from + 'T00:00:00');
  let bq = sb.from('stock_balance').select('store_id, item_id, qty');
  if (f.storeId) { pq = pq.eq('store_id', f.storeId); bq = bq.eq('store_id', f.storeId); }
  const [{ data: priorLedger }, { data: balNow }] = await Promise.all([pq, bq]);
  const before = {};
  (priorLedger || []).forEach(r => { const k2 = key(r.store_id, r.item_id); before[k2] = (before[k2] || 0) + (parseFloat(r.qty) || 0); });
  const now = {};
  (balNow || []).forEach(r => { now[key(r.store_id, r.item_id)] = parseFloat(r.qty) || 0; });

  const storeMap = {}; allStores.forEach(s => { storeMap[s.id] = s.name; });
  const itemMap = {}; allItems.forEach(i => { itemMap[i.id] = i; });

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('進銷存彙總');
  ws.columns = [
    { header: '門店', key: 'store', width: 14 },
    { header: '品項', key: 'name', width: 18 },
    { header: '類別', key: 'cat', width: 10 },
    { header: '單位', key: 'unit', width: 8 },
    { header: '期初庫存', key: 'opening', width: 10 },
    { header: '收貨入庫', key: 'receive', width: 10 },
    { header: '央廚出貨', key: 'fulfill', width: 10 },
    { header: '盤點校正', key: 'adjust', width: 10 },
    { header: '期末庫存', key: 'closing', width: 10 },
    { header: '單價', key: 'price', width: 10 },
    { header: '期末金額', key: 'value', width: 12 }
  ];
  styleHeader(ws);

  const sortedKeys = Object.keys(agg).sort((a, b) => {
    const [sa] = a.split('|'), [sb2] = b.split('|');
    return (storeMap[sa] || '').localeCompare(storeMap[sb2] || '');
  });
  sortedKeys.forEach(k => {
    const r = agg[k];
    const item = itemMap[r.item_id];
    if (!item) return;
    const opening = before[k] || 0;
    const closing = now[k] || 0;
    ws.addRow({
      store: storeMap[r.store_id] || '', name: item.name, cat: item.category || '',
      unit: item.unit || '', opening, receive: r.receive, fulfill: r.fulfill,
      adjust: r.adjust, closing, price: item.purchase_price || 0,
      value: closing * (item.purchase_price || 0)
    });
  });
  ['opening', 'receive', 'fulfill', 'adjust', 'closing'].forEach(c => { ws.getColumn(c).numFmt = '#,##0.##'; });
  ws.getColumn('price').numFmt = '#,##0';
  ws.getColumn('value').numFmt = '#,##0';
  await downloadWorkbook(wb, `進銷存彙總_${f.from}_${f.to}.xlsx`);
}

async function toggleStoreSupplier(el) {
  if (el.classList.contains('saving')) return;
  el.classList.add('saving');

  const storeId = el.dataset.store;
  const supplierId = el.dataset.supplier;
  const recordId = el.dataset.record;
  const newState = !el.classList.contains('on');

  try {
    if (recordId) {
      await sb.from('store_suppliers').update({ is_active: newState }).eq('id', recordId);
    } else {
      const { data } = await sb.from('store_suppliers').insert({ store_id: storeId, supplier_id: supplierId, is_active: newState }).select().single();
      if (data) el.dataset.record = data.id;
    }
    el.classList.toggle('on', newState);
  } catch (err) {
    alert('更新失敗：' + (err.message || err));
  } finally {
    el.classList.remove('saving');
  }
}

// ══════════ DASHBOARD ══════════
async function loadDashboard() {
  const el = document.getElementById('dashboardPage');
  el.innerHTML = '<div class="section-bar">總覽</div><div class="loading">載入中…</div>';

  const today = getToday();
  const monday = getMonday(today);

  const [{ count: pendingCount }, { count: priceCount }, { data: todayOrders }] = await Promise.all([
    sb.from('orders').select('*', { count: 'exact', head: true }).in('status', ['submitted', 'confirmed']),
    sb.from('price_reviews').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
    sb.from('orders').select('*, order_items(*, items(*))').eq('order_date', today).neq('status', 'cancelled')
  ]);

  const storeOrderMap = {};
  const supplierOrderMap = {};
  (todayOrders || []).forEach(o => {
    if (!storeOrderMap[o.store_id]) storeOrderMap[o.store_id] = { count: 0, items: [] };
    storeOrderMap[o.store_id].count++;
    (o.order_items || []).forEach(oi => {
      const item = oi.items;
      if (!item) return;
      const existing = storeOrderMap[o.store_id].items.find(x => x.id === item.id);
      if (existing) { existing.qty += oi.ordered_qty; }
      else { storeOrderMap[o.store_id].items.push({ id: item.id, name: item.name, qty: oi.ordered_qty, unit: item.unit || '' }); }
      if (oi.supplier_id) {
        if (!supplierOrderMap[oi.supplier_id]) supplierOrderMap[oi.supplier_id] = 0;
        supplierOrderMap[oi.supplier_id]++;
      }
    });
  });

  const activeStores = allStores.filter(s => s.is_active && s.type === 'store');
  const noOrderStores = activeStores.filter(s => !storeOrderMap[s.id]);
  const todaySentKey = 'dash_sent_' + today;
  const sentSuppliers = JSON.parse(localStorage.getItem(todaySentKey) || '[]');
  const kitchenCatMap = {};
  (todayOrders || []).forEach(o => {
    (o.order_items || []).forEach(oi => {
      const item = oi.items;
      if (!item || !oi.supplier_id) return;
      const sup = allSuppliers.find(s => s.id === oi.supplier_id);
      if (sup?.type === 'central_kitchen') {
        const cat = getMergedCat(item.category || '其他');
        const key = oi.supplier_id + ':' + cat;
        if (!kitchenCatMap[key]) kitchenCatMap[key] = { id: key, supId: oi.supplier_id, name: '央廚·' + cat, count: 0 };
        kitchenCatMap[key].count++;
      }
    });
  });

  const externalSuppliers = Object.keys(supplierOrderMap)
    .map(sid => {
      const sup = allSuppliers.find(s => s.id === sid);
      return sup && sup.type !== 'central_kitchen' ? { id: sid, name: sup.name, count: supplierOrderMap[sid] } : null;
    }).filter(Boolean);

  const pendingSuppliers = [
    ...externalSuppliers.filter(s => !sentSuppliers.includes(s.id)),
    ...Object.values(kitchenCatMap).filter(s => !sentSuppliers.includes(s.id))
  ];

  let html = '<div class="section-bar">總覽</div>';

  if (noOrderStores.length) {
    html += `<div style="margin:8px 16px;padding:10px 14px;background:#fef3cd;border:1px solid #ffc107;border-radius:10px">
      <div style="font-size:13px;font-weight:600;color:#856404;margin-bottom:4px">⚠️ 尚未叫貨</div>
      <div style="font-size:13px;color:#856404">${noOrderStores.map(s => s.name).join('、')}</div>
    </div>`;
  }

  if (pendingSuppliers.length) {
    html += `<div style="margin:8px 16px;padding:10px 14px;background:#e8f4fd;border:1px solid #90caf9;border-radius:10px">
      <div style="font-size:13px;font-weight:600;color:#1565c0;margin-bottom:6px">📋 今日待發彙總</div>
      ${pendingSuppliers.map(s =>
        `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0">
          <span style="font-size:13px;color:#1565c0">${s.name}（${s.count} 項）</span>
          <button onclick="markSupplierSent('${s.id}',this)" style="font-size:11px;padding:3px 10px;border:1px solid #90caf9;border-radius:6px;background:#fff;color:#1565c0;cursor:pointer;font-family:inherit">標記已發</button>
        </div>`
      ).join('')}
    </div>`;
  }

  html += '<div class="stat-grid">';
  html += `<div class="stat-card" onclick="switchTab('receive')"><div class="stat-label">待處理訂單</div><div class="stat-value ${pendingCount > 0 ? 'orange' : 'green'}">${pendingCount}</div><div style="font-size:11px;color:var(--text3);margin-top:4px">已送出 / 已確認</div></div>`;
  html += `<div class="stat-card" onclick="switchTab('price')"><div class="stat-label">待審核價格</div><div class="stat-value ${priceCount > 0 ? 'red' : 'green'}">${priceCount}</div><div style="font-size:11px;color:var(--text3);margin-top:4px">價格變更待核准</div></div>`;
  html += '</div>';

  html += '<div style="padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--text2)">今日各店叫貨</div>';
  activeStores.forEach(store => {
    const data = storeOrderMap[store.id];
    const hasOrder = data && data.count > 0;
    html += `<div>
      <div class="dash-store-row" style="cursor:pointer" onclick="this.nextElementSibling&&this.nextElementSibling.classList.toggle('hidden')">
        <div class="dash-dot ${hasOrder ? 'on' : 'off'}"></div>
        <div class="dash-store-name">${store.name}</div>
        <div class="dash-store-info">${hasOrder ? data.count + ' 筆 · ' + data.items.length + ' 項 ▾' : '尚未叫貨'}</div>
      </div>
      ${hasOrder ? `<div class="hidden" style="background:var(--surface2);border-bottom:1px solid var(--border)">
        ${data.items.sort((a, b) => a.name.localeCompare(b.name, 'zh-TW')).map(it =>
          `<div style="display:flex;justify-content:space-between;padding:6px 16px 6px 38px;font-size:13px;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${it.name}</span><span style="font-weight:600;color:var(--accent)">${it.qty} ${it.unit}</span></div>`
        ).join('')}
      </div>` : ''}
    </div>`;
  });

  el.innerHTML = html;
}

function markSupplierSent(supId, btn) {
  const today = getToday();
  const key = 'dash_sent_' + today;
  const sent = JSON.parse(localStorage.getItem(key) || '[]');
  if (!sent.includes(supId)) sent.push(supId);
  localStorage.setItem(key, JSON.stringify(sent));
  const row = btn.parentElement;
  row.style.opacity = '0.4';
  row.style.textDecoration = 'line-through';
  btn.textContent = '✓ 已發';
  btn.disabled = true;
}

// ══════════ ORDER TEMPLATES ══════════
function openTplSheet() {
  loadTplList();
  document.getElementById('tplOverlay').classList.add('show');
}
function closeTplSheet() {
  document.getElementById('tplOverlay').classList.remove('show');
}

async function loadTplList() {
  const el = document.getElementById('tplContent');
  el.innerHTML = '<div class="loading">載入中…</div>';

  let query = sb.from('order_templates').select('*').eq('is_active', true).order('created_at', { ascending: false });
  if (currentUser.store_id && currentUser.role !== 'admin') {
    query = query.eq('store_id', currentUser.store_id);
  }
  const { data: templates } = await query;

  if (!templates?.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📋</div><div class="msg">尚無模板<br><span style="font-size:12px;color:var(--text3)">到「紀錄」頁點訂單 → 存為模板</span></div></div>';
    return;
  }

  el.innerHTML = templates.map(t => {
    const items = t.items || [];
    const storeName = allStores.find(s => s.id === t.store_id)?.name || '';
    const isAdmin = currentUser.role === 'admin';
    return `<div class="tpl-item">
      <div class="tpl-item-info">
        <div class="tpl-item-name">${t.name}</div>
        <div class="tpl-item-sub">${storeName ? storeName + ' · ' : ''}${items.length} 項 · ${t.order_type === 'internal' ? '央廚' : '外部'}</div>
      </div>
      <div class="tpl-item-actions">
        <button class="tpl-btn tpl-btn-use" onclick="applyTemplate('${t.id}')">載入</button>
        ${isAdmin || t.created_by === currentUser.id ? `<button class="tpl-btn tpl-btn-del" onclick="deleteTemplate('${t.id}',this)">刪除</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function applyTemplate(tplId) {
  const { data: tpl } = await sb.from('order_templates').select('*').eq('id', tplId).single();
  if (!tpl) { alert('模板不存在'); return; }

  cart = {};
  orderType = tpl.order_type;
  (tpl.items || []).forEach(ti => {
    const item = allItems.find(i => i.id === ti.item_id);
    if (!item) return;
    cart[ti.item_id] = { qty: ti.qty, supplierId: ti.supplier_id || getDefaultSupplier(ti.item_id) };
  });

  closeTplSheet();
  renderOrderPage();
  updFloat();
}

async function deleteTemplate(tplId, btn) {
  if (!confirm('確定刪除此模板？')) return;
  btn.disabled = true;
  await sb.from('order_templates').update({ is_active: false }).eq('id', tplId);
  loadTplList();
}

async function saveOrderAsTemplate(orderId) {
  const { data: order } = await sb.from('orders').select('*, order_items(*, items(*)), stores(*)').eq('id', orderId).single();
  if (!order) { alert('找不到訂單'); return; }

  const name = prompt('模板名稱：', (order.stores?.name || '') + ' ' + (order.order_type === 'internal' ? '央廚' : '外部') + '常用');
  if (!name) return;

  const items = (order.order_items || []).map(oi => ({
    item_id: oi.item_id,
    qty: oi.ordered_qty,
    supplier_id: oi.supplier_id
  }));

  const { error } = await sb.from('order_templates').insert({
    store_id: order.store_id,
    name,
    order_type: order.order_type,
    items,
    created_by: currentUser.id
  });

  if (error) { alert('儲存失敗：' + error.message); return; }
  alert('已儲存為模板「' + name + '」');
}

async function saveCartAsTemplate() {
  const entries = Object.entries(cart).filter(([, v]) => v.qty > 0);
  if (!entries.length) { alert('叫貨單是空的'); return; }

  const storeId = currentUser.store_id || (currentUser.role === 'ops' ? currentUser.store_id : null);
  const name = prompt('模板名稱：', (orderType === 'internal' ? '央廚' : '外部') + '常用叫貨');
  if (!name) return;

  const items = entries.map(([itemId, v]) => ({
    item_id: itemId,
    qty: v.qty,
    supplier_id: v.supplierId
  }));

  const { error } = await sb.from('order_templates').insert({
    store_id: storeId,
    name,
    order_type: orderType,
    items,
    created_by: currentUser.id
  });

  if (error) { alert('儲存失敗：' + error.message); return; }
  alert('已儲存為模板「' + name + '」');
}

// ══════════ 品項對照表 (Module: Cost Control) ══════════
let mapSubTab = 'products';
let stdProducts = [];
let productMappings = [];
let mapSearchTerm = '';
let mapCatFilter = 'ALL';
let mapBrandFilter = 'ALL';

async function loadMapping() {
  const el = document.getElementById('mappingPage');
  el.innerHTML = '<div class="loading">載入中…</div>';

  const [{ data: sp }, { data: pm }] = await Promise.all([
    sb.from('standard_products').select('*').order('category').order('name'),
    sb.from('product_mapping').select('*, standard_products(name)').order('raw_name')
  ]);
  stdProducts = sp || [];
  productMappings = pm || [];
  renderMapping();
}

function renderMapping() {
  const el = document.getElementById('mappingPage');
  const unmappedCount = productMappings.filter(m => !m.standard_product_id).length;

  let html = `<div class="map-sub-tabs">
    <button class="map-sub-tab ${mapSubTab === 'products' ? 'active' : ''}" onclick="mapSubTab='products';renderMapping()">標準品項 (${stdProducts.length})</button>
    <button class="map-sub-tab ${mapSubTab === 'mappings' ? 'active' : ''}" onclick="mapSubTab='mappings';renderMapping()">對照表 (${productMappings.length})${unmappedCount ? ' ⚠' : ''}</button>
  </div>`;

  if (mapSubTab === 'products') {
    html += renderStdProducts();
  } else {
    html += renderMappings();
  }
  el.innerHTML = html;
}

function renderStdProducts() {
  const brands = ['ALL', ...new Set(stdProducts.map(p => p.brand).filter(Boolean))];
  const cats = ['ALL', ...new Set(stdProducts.map(p => p.category).filter(Boolean))];
  let filtered = stdProducts;
  if (mapBrandFilter !== 'ALL') filtered = filtered.filter(p => p.brand === mapBrandFilter);
  if (mapCatFilter !== 'ALL') filtered = filtered.filter(p => p.category === mapCatFilter);
  if (mapSearchTerm) {
    const q = mapSearchTerm.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
  }

  let html = `<div class="mgmt-bar"><span class="count">${filtered.length} 項標準品項</span><button class="add-btn" onclick="openStdProductForm()">＋ 新增品項</button></div>`;
  html += `<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" placeholder="搜尋品項…" value="${mapSearchTerm}" oninput="mapSearchTerm=this.value;renderMapping()"></div>`;
  if (brands.length > 2) {
    html += `<div class="cat-filter">${brands.map(b => `<button class="cat-btn ${mapBrandFilter === b ? 'active' : ''}" onclick="mapBrandFilter='${b}';renderMapping()">${b === 'ALL' ? '全品牌' : b}</button>`).join('')}</div>`;
  }
  if (cats.length > 2) {
    html += `<div class="cat-filter">${cats.map(c => `<button class="cat-btn ${mapCatFilter === c ? 'active' : ''}" onclick="mapCatFilter='${c}';renderMapping()">${c === 'ALL' ? '全部' : c}</button>`).join('')}</div>`;
  }

  filtered.forEach(p => {
    const mapCount = productMappings.filter(m => m.standard_product_id === p.id).length;
    html += `<div class="mgmt-item" onclick="openStdProductForm('${p.id}')">
      <div class="mi-info"><div class="mi-name">${p.name}</div><div class="mi-sub">${p.brand || '—'} · ${p.category || '—'} · ${mapCount} 筆對照</div></div>
      <div class="mi-arrow">›</div>
    </div>`;
  });
  if (!filtered.length) html += '<div class="empty-state"><div class="icon">📋</div><div class="msg">沒有標準品項</div></div>';
  return html;
}

function renderMappings() {
  const channels = ['ALL', ...new Set(productMappings.map(m => m.channel).filter(Boolean))];
  let filtered = productMappings;
  if (mapCatFilter === 'unmapped') {
    filtered = filtered.filter(m => !m.standard_product_id);
  } else if (mapCatFilter !== 'ALL') {
    filtered = filtered.filter(m => m.channel === mapCatFilter);
  }
  if (mapSearchTerm) {
    const q = mapSearchTerm.toLowerCase();
    filtered = filtered.filter(m => m.raw_name.toLowerCase().includes(q) || (m.standard_products?.name || '').toLowerCase().includes(q));
  }

  const unmappedCount = productMappings.filter(m => !m.standard_product_id).length;
  let html = `<div class="mgmt-bar"><span class="count">${filtered.length} 筆對照</span><button class="add-btn" onclick="openMappingForm()">＋ 新增對照</button></div>`;
  html += `<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" placeholder="搜尋原始品名…" value="${mapSearchTerm}" oninput="mapSearchTerm=this.value;renderMapping()"></div>`;

  const filterBtns = [{ v: 'ALL', l: '全部' }];
  if (unmappedCount) filterBtns.push({ v: 'unmapped', l: `待歸類 (${unmappedCount})` });
  channels.filter(c => c !== 'ALL').forEach(c => filterBtns.push({ v: c, l: c }));
  if (filterBtns.length > 1) {
    html += `<div class="cat-filter">${filterBtns.map(f => `<button class="cat-btn ${mapCatFilter === f.v ? 'active' : ''}" onclick="mapCatFilter='${f.v}';renderMapping()">${f.l}</button>`).join('')}</div>`;
  }

  if (unmappedCount && mapCatFilter !== 'unmapped') {
    html += `<div class="map-unmapped">⚠️ ${unmappedCount} 筆品名尚未歸類</div>`;
  }

  filtered.forEach(m => {
    const stdName = m.standard_products?.name;
    html += `<div class="mgmt-item" onclick="openMappingForm('${m.id}')">
      <div class="mi-info">
        <div class="mi-name">${m.raw_name}</div>
        <div class="mi-sub">${m.channel ? `<span class="map-tag ch">${m.channel}</span> ` : ''}→ ${stdName ? stdName : '<span class="map-tag unmapped">待歸類</span>'}</div>
      </div>
      <div class="mi-arrow">›</div>
    </div>`;
  });
  if (!filtered.length) html += '<div class="empty-state"><div class="icon">🔗</div><div class="msg">沒有對照紀錄</div></div>';
  return html;
}

function openStdProductForm(productId) {
  const product = productId ? stdProducts.find(p => p.id === productId) : null;
  const isEdit = !!product;
  document.getElementById('formOverlay')?.remove();

  const existingCats = [...new Set(stdProducts.map(p => p.category).filter(Boolean))];
  const overlay = document.createElement('div');
  overlay.id = 'formOverlay';
  overlay.className = 'form-overlay show';
  overlay.innerHTML = `
    <div class="form-sheet">
      <div class="form-handle"></div>
      <div class="form-header"><div class="form-title">${isEdit ? '編輯標準品項' : '新增標準品項'}</div><button class="form-close" onclick="document.getElementById('formOverlay').remove()">✕</button></div>
      <div class="form-body">
        <div class="form-group"><label class="form-label">品項名稱 *</label><input class="form-input" id="spName" value="${product?.name || ''}" placeholder="例：招牌好湯鍋"></div>
        <div class="form-group"><label class="form-label">品牌</label>
          <div class="chip-group" id="spBrand">
            <span class="chip ${(!product?.brand || product?.brand === '麻媽家') ? 'active' : ''}" data-val="麻媽家" onclick="selectChip('spBrand',this)">麻媽家</span>
            <span class="chip ${product?.brand === '涼三伯' ? 'active' : ''}" data-val="涼三伯" onclick="selectChip('spBrand',this)">涼三伯</span>
            <span class="chip ${product?.brand === '共用' ? 'active' : ''}" data-val="共用" onclick="selectChip('spBrand',this)">共用</span>
          </div></div>
        <div class="form-group"><label class="form-label">類別</label><input class="form-input" id="spCategory" value="${product?.category || ''}" placeholder="例：湯鍋類" list="spCatOptions">
          <datalist id="spCatOptions">${existingCats.map(c => `<option value="${c}">`).join('')}</datalist></div>
        <button class="form-save" onclick="saveStdProduct('${productId || ''}')">${isEdit ? '儲存變更' : '新增品項'}</button>
        ${isEdit ? `<button class="form-delete" onclick="deleteStdProduct('${productId}')">刪除此品項</button>` : ''}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function saveStdProduct(productId) {
  const name = document.getElementById('spName').value.trim();
  if (!name) { alert('請輸入品項名稱'); return; }
  const brand = document.querySelector('#spBrand .chip.active')?.dataset.val || null;
  const category = document.getElementById('spCategory').value.trim() || null;

  const row = { name, brand, category };
  let error;
  if (productId) {
    ({ error } = await sb.from('standard_products').update(row).eq('id', productId));
  } else {
    ({ error } = await sb.from('standard_products').insert(row));
  }
  if (error) { alert('儲存失敗：' + error.message); return; }
  document.getElementById('formOverlay').remove();
  loadMapping();
}

async function deleteStdProduct(productId) {
  const mapCount = productMappings.filter(m => m.standard_product_id === productId).length;
  if (mapCount > 0) { alert(`此品項有 ${mapCount} 筆對照關係，請先移除對照後再刪除`); return; }
  if (!confirm('確定要刪除此標準品項？')) return;
  const { error } = await sb.from('standard_products').delete().eq('id', productId);
  if (error) { alert('刪除失敗：' + error.message); return; }
  document.getElementById('formOverlay').remove();
  loadMapping();
}

function openMappingForm(mappingId) {
  const mapping = mappingId ? productMappings.find(m => m.id === mappingId) : null;
  const isEdit = !!mapping;
  document.getElementById('formOverlay')?.remove();

  const channels = [...new Set(productMappings.map(m => m.channel).filter(Boolean))];
  const overlay = document.createElement('div');
  overlay.id = 'formOverlay';
  overlay.className = 'form-overlay show';
  overlay.innerHTML = `
    <div class="form-sheet">
      <div class="form-handle"></div>
      <div class="form-header"><div class="form-title">${isEdit ? '編輯對照' : '新增對照'}</div><button class="form-close" onclick="document.getElementById('formOverlay').remove()">✕</button></div>
      <div class="form-body">
        <div class="form-group"><label class="form-label">原始品名（CSV 上的名稱）*</label><input class="form-input" id="pmRaw" value="${mapping?.raw_name || ''}" placeholder="例：(超值選)招牌好湯鍋"></div>
        <div class="form-group"><label class="form-label">通路來源</label><input class="form-input" id="pmChannel" value="${mapping?.channel || ''}" placeholder="例：UberEats、FoodPanda、POS" list="chOptions">
          <datalist id="chOptions">${channels.map(c => `<option value="${c}">`).join('')}</datalist></div>
        <div class="form-group"><label class="form-label">對應標準品項</label>
          <select class="form-select" id="pmStdId">
            <option value="">— 待歸類 —</option>
            ${stdProducts.filter(p => p.is_active).map(p => `<option value="${p.id}" ${mapping?.standard_product_id === p.id ? 'selected' : ''}>${p.name}${p.brand ? ' (' + p.brand + ')' : ''}</option>`).join('')}
          </select></div>
        <button class="form-save" onclick="saveMapping('${mappingId || ''}')">${isEdit ? '儲存變更' : '新增對照'}</button>
        ${isEdit ? `<button class="form-delete" onclick="deleteMapping('${mappingId}')">刪除此對照</button>` : ''}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function saveMapping(mappingId) {
  const raw_name = document.getElementById('pmRaw').value.trim();
  if (!raw_name) { alert('請輸入原始品名'); return; }
  const channel = document.getElementById('pmChannel').value.trim() || null;
  const standard_product_id = document.getElementById('pmStdId').value || null;

  const row = { raw_name, channel, standard_product_id };

  if (mappingId) {
    ({ error } = await sb.from('product_mapping').update(row).eq('id', mappingId));

    ({ error } = await sb.from('product_mapping').insert(row));
  }
  if (error) { alert('儲存失敗：' + error.message); return; }
  document.getElementById('formOverlay').remove();
  loadMapping();
}

async function deleteMapping(mappingId) {
  if (!confirm('確定要刪除此對照？')) return;
  const { error } = await sb.from('product_mapping').delete().eq('id', mappingId);
  if (error) { alert('刪除失敗：' + error.message); return; }
  document.getElementById('formOverlay').remove();
  loadMapping();
}

// ══════════ SOP 配比 ══════════
let sopList = [];
let sopBrandFilter = 'ALL';
let sopSearch = '';

async function loadSop() {
  const el = document.getElementById('sopPage');
  el.innerHTML = '<div class="loading">載入中…</div>';
  const [{ data: sops }, { data: sp }] = await Promise.all([
    sb.from('product_sop').select('*, standard_products(name, category)').order('updated_at', { ascending: false }),
    sb.from('standard_products').select('*').eq('is_active', true).order('name')
  ]);
  sopList = sops || [];
  stdProducts = sp || [];
  renderSop();
}

function renderSop() {
  const el = document.getElementById('sopPage');
  const isAdmin = currentUser.role === 'admin';
  const brands = ['ALL', ...new Set(sopList.map(s => s.brand).filter(Boolean))];
  let filtered = sopList;
  if (sopBrandFilter !== 'ALL') filtered = filtered.filter(s => s.brand === sopBrandFilter);
  if (sopSearch) {
    const q = sopSearch.toLowerCase();
    filtered = filtered.filter(s => (s.standard_products?.name || '').toLowerCase().includes(q));
  }

  let html = '';
  if (isAdmin) {
    html += `<div class="mgmt-bar"><span class="count">${filtered.length} 份 SOP</span><button class="add-btn" onclick="openSopForm()">＋ 新增 SOP</button></div>`;
  } else {
    html += `<div class="mgmt-bar"><span class="count">${filtered.length} 份 SOP</span></div>`;
  }
  html += `<div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input class="search-input" placeholder="搜尋品項…" value="${sopSearch}" oninput="sopSearch=this.value;renderSop()"></div>`;
  if (brands.length > 2) {
    html += `<div class="cat-filter">${brands.map(b => `<button class="cat-btn ${sopBrandFilter === b ? 'active' : ''}" onclick="sopBrandFilter='${b}';renderSop()">${b === 'ALL' ? '全部' : b}</button>`).join('')}</div>`;
  }

  if (!filtered.length) {
    html += '<div class="empty-state"><div class="icon">📖</div><div class="msg">尚無 SOP 配比</div></div>';
  }

  filtered.forEach((sop, idx) => {
    const brandClass = sop.brand === '麻媽家' ? 'mama' : sop.brand === '涼三伯' ? 'cool' : 'shared';
    const ingredients = sop.ingredients || [];
    const steps = sop.steps || [];
    html += `<div class="sop-card">
      <div class="sop-card-head" onclick="toggleSopDetail(${idx})">
        ${sop.brand ? `<span class="sop-brand-tag ${brandClass}">${sop.brand}</span>` : ''}
        <span class="sop-product">${sop.standard_products?.name || '—'}</span>
        <span style="font-size:12px;color:var(--text3)">${ingredients.length} 料 · ${steps.length} 步</span>
        <span style="margin-left:8px;color:var(--text3);font-size:14px" id="sopArrow${idx}">›</span>
      </div>
      <div class="sop-detail" id="sopDetail${idx}">`;

    if (ingredients.length) {
      html += '<div class="sop-section-label">配料</div>';
      ingredients.forEach(ig => {
        html += `<div class="sop-ingr"><span class="sop-ingr-name">${ig.name}</span><span class="sop-ingr-qty">${ig.qty} ${ig.unit || ''}</span></div>`;
      });
    }

    if (steps.length) {
      html += '<div class="sop-section-label">步驟</div>';
      steps.forEach((st, si) => {
        const text = typeof st === 'string' ? st : st.text || '';
        html += `<div class="sop-step"><span class="sop-step-num">${si + 1}</span><span class="sop-step-text">${text}</span></div>`;
      });
    }

    if (sop.standard || sop.storage) {
      html += '<div class="sop-section-label">標準 / 保存</div><div class="sop-meta">';
      if (sop.standard) html += `成品標準：${sop.standard}<br>`;
      if (sop.storage) html += `保存條件：${sop.storage}`;
      html += '</div>';
    }

    if (isAdmin) {
      html += `<div style="padding:8px 0 4px;display:flex;gap:8px">
        <button class="add-btn" style="flex:1" onclick="openSopForm('${sop.id}')">✏️ 編輯</button>
        <button class="add-btn" style="flex:none;background:var(--red-bg);color:var(--red);border:1px solid var(--red)" onclick="deleteSop('${sop.id}')">刪除</button>
      </div>`;
    }

    html += '</div></div>';
  });

  el.innerHTML = html;
}

function toggleSopDetail(idx) {
  const detail = document.getElementById('sopDetail' + idx);
  const arrow = document.getElementById('sopArrow' + idx);
  const isOpen = detail.classList.toggle('open');
  arrow.textContent = isOpen ? '⌄' : '›';
}

function openSopForm(sopId) {
  const sop = sopId ? sopList.find(s => s.id === sopId) : null;
  const isEdit = !!sop;
  document.getElementById('formOverlay')?.remove();

  const ingredients = isEdit ? (sop.ingredients || []) : [];
  const steps = isEdit ? (sop.steps || []) : [];

  const overlay = document.createElement('div');
  overlay.id = 'formOverlay';
  overlay.className = 'form-overlay show';
  overlay.innerHTML = `
    <div class="form-sheet">
      <div class="form-handle"></div>
      <div class="form-header"><div class="form-title">${isEdit ? '編輯 SOP' : '新增 SOP'}</div><button class="form-close" onclick="document.getElementById('formOverlay').remove()">✕</button></div>
      <div class="form-body">
        <div class="form-group"><label class="form-label">標準品項 *</label>

async function saveSop(sopId) {

  document.querySelectorAll('#sopIngrList .sop-ingr-form').forEach(row => {
    const name = row.querySelector('.ingr-name').value.trim();

  const steps = [];

    const text = row.querySelector('.step-text').value.trim();

const SKIP_CATS = ['加購','客製化','套餐選項','贈送','辣度','醬料','湯頭','其他','貼紙','超值選選項','加購配餐'];

async function loadSalesHistory() {

}

function parseSalesCsv(input) { if (input.files.length) parseSalesCsvFile(input.files[0]); }

function parseSalesCsvFile(file) {
  const reader = new FileReader();
  reader.onload = async (e) => {
    let text = e.target.result.replace(/^﻿/, '');
    const filename = file.name;

    const storeInfo = parseStoreFromFilename(filename);
    const dateInfo = parseDateFromFilename(filename);

    const rows = parseCsvText(text);
    if (rows.length < 2) { alert('CSV 檔案格式不正確'); return; }

    const headers = rows[0];
    const nameIdx = headers.indexOf('品項');
    const catIdx = headers.indexOf('類別');
    const priceIdx = headers.indexOf('平均售價');
    const revenueIdx = headers.indexOf('銷售總額');
    const qtyIdx = headers.indexOf('銷售量');

    if (nameIdx < 0 || qtyIdx < 0) { alert('找不到必要欄位（品項、銷售量）'); return; }

    if (!stdProducts.length) {
      const { data } = await sb.from('standard_products').select('*').eq('is_active', true);
      stdProducts = data || [];
    }

    const items = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (r.length <= nameIdx) continue;
      const rawName = r[nameIdx]?.trim();
      if (!rawName) continue;
      const cat = catIdx >= 0 ? r[catIdx]?.trim() : '';
      const price = parseNumericField(priceIdx >= 0 ? r[priceIdx] : '0');
      const revenue = parseNumericField(revenueIdx >= 0 ? r[revenueIdx] : '0');
      const qty = parseInt(qtyIdx >= 0 ? r[qtyIdx]?.replace(/,/g, '') : '0') || 0;

      const isSkip = price === 0 || SKIP_CATS.some(sk => cat.includes(sk)) || /選擇|必選/.test(cat);
      const matched = matchStdProduct(rawName);

      items.push({ rawName, cat, price, revenue, qty, isSkip, matched, include: !isSkip });
    }

    salesPreviewData = { storeInfo, dateInfo, items, filename };
    renderSalesPreview();
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCsvText(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuote) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuote = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuote = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || (c === '\r' && text[i + 1] === '\n')) {
        row.push(field); field = '';
        if (row.some(f => f.trim())) rows.push(row);
        row = [];
        if (c === '\r') i++;
      } else { field += c; }
    }
  }
  if (field || row.length) { row.push(field); if (row.some(f => f.trim())) rows.push(row); }
  return rows;
}

function parseNumericField(val) {
  if (!val) return 0;
  return parseFloat(String(val).replace(/,/g, '').replace(/%/g, '')) || 0;
}

function parseStoreFromFilename(name) {
  const m = name.match(/^(.+?)_品項統計/);
  if (!m) return null;
  const raw = m[1].replace(/店$/, '').replace(/[-\s]/g, '');
  const store = allStores.find(s => raw.includes(s.name) || s.name.includes(raw));
  return store || { name: raw, id: null };
}

function parseDateFromFilename(name) {
  const m = name.match(/(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : getToday();
}

function matchStdProduct(rawName) {
  let best = null;
  let bestLen = 0;
  for (const sp of stdProducts) {
    if (rawName.includes(sp.name) && sp.name.length > bestLen) { best = sp; bestLen = sp.name.length; }
    if (sp.name.includes(rawName) && rawName.length > bestLen) { best = sp; bestLen = rawName.length; }
  }
  return best;
}

        <option value="">— 選擇門店 —</option>
        ${allStores.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
      </select></div>`;
  }

  html += `<div class="sales-preview"><table>
    <tr><th style="width:30px"><input type="checkbox" checked onchange="toggleAllSales(this.checked)"></th><th>品項</th><th>類別</th><th style="text-align:right">售價</th><th style="text-align:right">營收</th><th style="text-align:right">數量</th><th>配對</th></tr>`;

  d.items.forEach((item, idx) => {
    html += `<tr class="${item.include ? '' : 'skipped'}">
      <td><input type="checkbox" ${item.include ? 'checked' : ''} onchange="salesPreviewData.items[${idx}].include=this.checked;renderSalesPreview()"></td>
      <td>${item.rawName}</td>
      <td style="font-size:12px;color:var(--text3)">${item.cat}</td>
      <td style="text-align:right">${item.price}</td>
      <td style="text-align:right">${item.revenue.toLocaleString()}</td>
      <td style="text-align:right">${item.qty}</td>
      <td>${item.matched ? `<span class="sales-match yes">${item.matched.name}</span>` : '<span class="sales-match no">—</span>'}</td>
    </tr>`;
  });

  html += '</table></div>';
  html += `<div class="sales-actions">
    <button class="form-save" style="flex:1;margin:0" onclick="importSalesData()">確認匯入 (${included.length} 筆)</button>
    <button class="add-btn" style="background:var(--surface2);color:var(--text2);border:1px solid var(--border)" onclick="salesPreviewData=null;document.getElementById('salesPreviewArea').innerHTML=''">取消</button>
  </div>`;

  el.innerHTML = html;
}

function toggleAllSales(checked) {
  salesPreviewData.items.forEach(i => { if (!i.isSkip || checked) i.include = checked; });
  renderSalesPreview();
}

async function importSalesData() {
  const d = salesPreviewData;
  if (!d?.storeInfo?.id) { alert('請選擇門店'); return; }

  const included = d.items.filter(i => i.include);
  if (!included.length) { alert('沒有要匯入的品項'); return; }

  const { count } = await sb.from('daily_sales').select('*', { count: 'exact', head: true }).eq('store_id', d.storeInfo.id).eq('sale_date', d.dateInfo);
  if (count > 0) {
    if (!confirm(`${d.storeInfo.name} 在 ${d.dateInfo} 已有 ${count} 筆資料，要覆蓋嗎？`)) return;
    await sb.from('daily_sales').delete().eq('store_id', d.storeInfo.id).eq('sale_date', d.dateInfo);
  }

  const rows = included.map(i => ({
    store_id: d.storeInfo.id,
    sale_date: d.dateInfo,
    raw_name: i.rawName,
    standard_product_id: i.matched?.id || null,
    category: i.cat || null,
    avg_price: i.price,
    total_revenue: i.revenue,
    quantity: i.qty
  }));

  const batchSize = 50;
  for (let i = 0; i < rows.length; i += batchSize) {
    const batch = rows.slice(i, i + batchSize);
    const { error } = await sb.from('daily_sales').insert(batch);
    if (error) { alert(`匯入第 ${i+1}-${i+batch.length} 筆失敗：` + error.message); return; }
  }

  alert(`成功匯入 ${rows.length} 筆銷售資料`);
  salesPreviewData = null;
  document.getElementById('salesPreviewArea').innerHTML = '';
  document.getElementById('salesCsvFile').value = '';
  loadSalesHistory();
}

let wasteDate = getToday();

async function loadWaste() {
  const el = document.getElementById('wastePage');
  const isAdmin = currentUser.role === 'admin' || currentUser.role === 'ops';
  wasteStoreId = isAdmin ? (wasteStoreId || allStores[0]?.id) : currentUser.store_id;

  if (!coreItems.length) {
    const { data: ci } = await sb.from('core_items').select('*').eq('is_active', true).order('sort_order');
    coreItems = ci || [];
  }

  let html = '';
  if (isAdmin) {
    html += `<div style="padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
      <select class="form-select" onchange="wasteStoreId=this.value;loadWaste()" style="font-size:14px">
        ${allStores.map(s => `<option value="${s.id}" ${wasteStoreId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
      </select></div>`;
  }

  html += `<div class="prep-date-nav">
    <button class="prep-date-btn" onclick="shiftWasteDate(-1)">‹</button>
    <span class="prep-date-label">${wasteDate}</span>
    <button class="prep-date-btn" onclick="shiftWasteDate(1)">›</button>
  </div>`;

  const { data: existing } = await sb.from('waste_records').select('*').eq('store_id', wasteStoreId).eq('waste_date', wasteDate).order('recorded_at');
  const records = existing || [];

  html += `<div class="section-bar">新增報廢</div>
    <div style="padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)">
      <div class="form-row" style="margin-bottom:8px">
        <div class="form-group" style="margin:0"><select class="form-select" id="wasteItem" style="font-size:14px">
          ${coreItems.map(i => `<option value="${i.name}" data-unit="${i.unit}">${i.name}</option>`).join('')}
        </select></div>
        <div class="form-group" style="margin:0;display:flex;gap:6px">
          <input type="number" class="form-input" id="wasteQty" placeholder="數量" inputmode="decimal" style="flex:1">
          <span id="wasteUnit" style="font-size:13px;color:var(--text3);display:flex;align-items:center;min-width:30px">${coreItems[0].unit}</span>
        </div>
      </div>
      <div class="form-row" style="margin-bottom:8px">
        <div class="form-group" style="margin:0"><select class="form-select" id="wasteReason" style="font-size:14px">
          ${WASTE_REASONS.map(r => `<option>${r}</option>`).join('')}
        </select></div>
        <div class="form-group" style="margin:0"><button class="add-btn" style="width:100%;padding:10px" onclick="addWaste()">＋ 登記</button></div>
      </div>
    </div>`;

  if (records.length) {
    html += '<div class="section-bar">今日報廢紀錄</div>';
    records.forEach(r => {
      html += `<div class="prep-item">
        <div class="prep-item-name">${r.item_name}<div style="font-size:12px;color:var(--text3);margin-top:2px">${r.reason}</div></div>
        <div style="font-size:16px;font-weight:700;color:var(--red)">${r.quantity} ${r.unit}</div>
        <button class="sop-rm-btn" onclick="deleteWaste('${r.id}')">✕</button>
      </div>`;
    });
  } else {
    html += '<div class="empty-state"><div class="icon">✅</div><div class="msg">今日無報廢紀錄</div></div>';
  }

  el.innerHTML = html;
  document.getElementById('wasteItem')?.addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    document.getElementById('wasteUnit').textContent = opt.dataset.unit;
  });
}

function shiftWasteDate(delta) {
  const d = new Date(wasteDate);
  d.setDate(d.getDate() + delta);
  wasteDate = d.toISOString().slice(0, 10);
  loadWaste();
}

async function addWaste() {
  const itemName = document.getElementById('wasteItem').value;
  const qty = parseFloat(document.getElementById('wasteQty').value);
  if (!qty || qty <= 0) { alert('請輸入數量'); return; }
  const unit = document.getElementById('wasteUnit').textContent;
  const reason = document.getElementById('wasteReason').value;

  const { error } = await sb.from('waste_records').insert({
    store_id: wasteStoreId,
    waste_date: wasteDate,
    item_name: itemName,
    quantity: qty,
    unit,
    reason,
    recorded_by: currentUser.id
  });
  if (error) { alert('登記失敗：' + error.message); return; }
  document.getElementById('wasteQty').value = '';
  loadWaste();
}

async function deleteWaste(id) {
  if (!confirm('確定刪除此筆報廢紀錄？')) return;
  await sb.from('waste_records').delete().eq('id', id);
  loadWaste();
}

// ── Enter key ──
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') doLogin(); });
checkSession();
</script>
</body>
</html>
